                camera,
                scene,
                raycaster,
                renderer,
                selectionBox,
                terrain,

                get selectionOutline() { return selectionOutline; },
                set selectionOutline(val) { selectionOutline = val; },

                removeScenarioObject,
                snapObjectToTerrain,
                updateTerrainHeights,
                scaleObjectPreservingBottom,
                enterHumanControlMode,
                exitHumanControlMode,
                autoSaveScenario,
                createModelOutline,

                undoStack,
                redoStack,
                MAX_HISTORY,
                saveHistoryState,
                serializeScenario,
                undo,
                redo,
                updateHistoryButtons,
            };

            // --- CONTROLES DE VISUALIZAÇÃO ---
            const btnToggleWireframe = document.getElementById('btnToggleWireframe');

            if (btnToggleWireframe) {
                btnToggleWireframe.addEventListener('click', () => {
                    toggleWireframeMode();
                });
            }

            function toggleWireframeMode() {
                wireframeMode = !wireframeMode;
                if (btnToggleWireframe) {
                    btnToggleWireframe.classList.toggle('active', wireframeMode);
                    btnToggleWireframe.innerHTML = `<span class="btn-icon">&#9635;</span> Modo Wireframe: ${wireframeMode ? 'ON' : 'OFF'}`;
                }
                
                scene.traverse((child) => {
                    if (child.isMesh && child.material) {
                        if (Array.isArray(child.material)) {
                            child.material.forEach(mat => mat.wireframe = wireframeMode);
                        } else {
                            child.material.wireframe = wireframeMode;
                        }
                    }
                });
            }

            const inputManager = setupInput(inputState);

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.target.set(0, 40, 0);
            controls.update();

            function updateSunShadowFocus() {
                if (humanControlMode && controlledHuman) {
                    shadowFocusPoint.copy(controlledHuman.position);
                } else {
                    shadowFocusPoint.copy(controls.target);
                }

                shadowFocusPoint.y = 0;

                // Luz solar direcional
                sunLight.target.position.copy(shadowFocusPoint);
                sunLight.position.copy(shadowFocusPoint).add(sunLightOffset);
                sunLight.target.updateMatrixWorld();

                // Luz lunar direcional (segue o mesmo ponto de foco)
                moonDirLight.target.position.copy(shadowFocusPoint);
                moonDirLight.position.copy(shadowFocusPoint).add(moonLightOffset);
                moonDirLight.target.updateMatrixWorld();

            }

            const clock = new THREE.Clock();

            // --- WIRING DE CONTROLOS DIA/NOITE ---
            (function setupDayNightControls() {
                const slider = document.getElementById('timeSlider');
                const autoBtn = document.getElementById('timeAutoButton');

                if (slider) {
                    slider.addEventListener('input', () => {
                        dayTimeMinutes = parseFloat(slider.value);
                        applyDayNightCycle(dayTimeMinutes);
                    });
                }

                if (autoBtn) {
                    autoBtn.addEventListener('click', () => {
                        dayTimeCycleAuto = !dayTimeCycleAuto;
                        autoBtn.textContent = `Ciclo Auto: ${dayTimeCycleAuto ? 'ON' : 'OFF'}`;
                        autoBtn.classList.toggle('active', dayTimeCycleAuto);
                    });
                }

                // Aplica estado inicial
                applyDayNightCycle(dayTimeMinutes);
            })();

            function updateAmbientTumbleweeds(deltaTime) {
                const bounds = getTerrainBounds();

                for (let i = tumbleweeds.length - 1; i >= 0; i--) {
                    const tw = tumbleweeds[i];
                    const axis = tw.userData.rollAxis;
                    const speed = tw.userData.rollSpeed;
                    const wind = tw.userData.wind;

                    tw.rotateOnWorldAxis(axis, speed);
                    tw.position.x += wind.x;
                    tw.position.z += wind.y;

                    const origin = new THREE.Vector3(tw.position.x, 500, tw.position.z);
                    const downRay = new THREE.Raycaster(origin, new THREE.Vector3(0, -1, 0));
                    const hit = downRay.intersectObject(terrain);
                    if (hit.length > 0) {
                        const nowMs = Date.now();
                        const groundOffset = tw.userData.terrainSurfaceOffset ?? tw.userData.groundOffset ?? 0;

                        if (tw.userData.jumpHeight <= 0.0001 && nowMs >= (tw.userData.nextJumpAt ?? 0)) {
                            const isBigJump = Math.random() < (tw.userData.bigJumpChance ?? 0.2);
                            tw.userData.jumpVelocity = isBigJump
                                ? (1.9 + Math.random() * 0.8)
                                : (1.0 + Math.random() * 0.6);
                            tw.userData.nextJumpAt = isBigJump
                                ? (nowMs + 4200 + Math.random() * 6500)
                                : (nowMs + 2500 + Math.random() * 5500);
                        }

                        tw.userData.jumpVelocity -= (tw.userData.gravity ?? 0.08);
                        tw.userData.jumpHeight = Math.max(0, (tw.userData.jumpHeight ?? 0) + tw.userData.jumpVelocity);

                        if (tw.userData.jumpHeight === 0 && tw.userData.jumpVelocity < 0) {
                            tw.userData.jumpVelocity = 0;
                        }

                        tw.position.y = hit[0].point.y + groundOffset + tw.userData.jumpHeight;

                        const twBox = new THREE.Box3().setFromObject(tw);
                        const minAllowedY = hit[0].point.y + groundOffset;
                        if (twBox.min.y < minAllowedY) {
                            tw.position.y += (minAllowedY - twBox.min.y);
                        }
                    }

                    const flowStart = tw.userData.flowStart;
                    const flowDirection2D = tw.userData.flowDirection2D;
                    const despawnPadding = tw.userData.despawnPadding ?? 0;
                    const relativePosition = new THREE.Vector2(
                        tw.position.x - flowStart.x,
                        tw.position.z - flowStart.y
                    );
                    const distanceAlongPath = relativePosition.dot(flowDirection2D);
                    const isPastPath = distanceAlongPath > (tw.userData.pathLength ?? 0) + despawnPadding;
                    const isOutsideBounds = bounds && (
                        tw.position.x < bounds.min.x - despawnPadding ||
                        tw.position.x > bounds.max.x + despawnPadding ||
                        tw.position.z < bounds.min.z - despawnPadding ||
                        tw.position.z > bounds.max.z + despawnPadding
                    );

                    if (isPastPath || isOutsideBounds) {
                        scene.remove(tw);
                        tumbleweeds.splice(i, 1);
                    }
                }

                if (!tumbleweedEffectEnabled) return;

                tumbleweedSpawnTimer -= deltaTime;
                while (
                    tumbleweeds.length < TUMBLEWEED_EFFECT_SETTINGS.maxActive &&
                    tumbleweedSpawnTimer <= 0
                ) {
                    spawnAmbientTumbleweed();
                    tumbleweedSpawnTimer += randomTumbleweedSpawnInterval();
                }
            }

            // --- CONFIGURAÇÕES CONTROLOS EVENT LISTENERS ---
            const cfgSpeedSlider = document.getElementById('cfgSpeedSlider');
            const cfgSpeedValue = document.getElementById('cfgSpeedValue');
            if (cfgSpeedSlider && cfgSpeedValue) {
                cfgSpeedSlider.addEventListener('input', (e) => {
                    const val = parseInt(e.target.value);
                    humanControlSettings.speed = val;
                    cfgSpeedValue.textContent = val;
                });
            }

            const cfgJumpSlider = document.getElementById('cfgJumpSlider');
            const cfgJumpValue = document.getElementById('cfgJumpValue');
            if (cfgJumpSlider && cfgJumpValue) {
                cfgJumpSlider.addEventListener('input', (e) => {
                    const val = parseInt(e.target.value);
                    humanControlSettings.jumpSpeed = val;
                    cfgJumpValue.textContent = val;
                });
            }

            const cfgGravitySlider = document.getElementById('cfgGravitySlider');
            const cfgGravityValue = document.getElementById('cfgGravityValue');
            if (cfgGravitySlider && cfgGravityValue) {
                cfgGravitySlider.addEventListener('input', (e) => {
                    const val = parseInt(e.target.value);
                    humanControlSettings.gravity = val;
                    cfgGravityValue.textContent = val;
                });
            }

            const cfgSensitivitySlider = document.getElementById('cfgSensitivitySlider');
            const cfgSensitivityValue = document.getElementById('cfgSensitivityValue');
            if (cfgSensitivitySlider && cfgSensitivityValue) {
                cfgSensitivitySlider.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    humanControlSettings.mouseSensitivity = val;
                    cfgSensitivityValue.textContent = val.toFixed(4);
                });
            }

            const cfgTimeSpeedSlider = document.getElementById('cfgTimeSpeedSlider');
            const cfgTimeSpeedValue = document.getElementById('cfgTimeSpeedValue');
            if (cfgTimeSpeedSlider && cfgTimeSpeedValue) {
                cfgTimeSpeedSlider.addEventListener('input', (e) => {
                    const val = parseFloat(e.target.value);
                    dayCycleSpeedMultiplier = val;
                    cfgTimeSpeedValue.textContent = val.toFixed(1) + 'x';
                });
            }

            const undoButton = document.getElementById('undoButton');
            if (undoButton) {
                undoButton.addEventListener('click', () => {
                    window.undo();
                });
            }

            const redoButton = document.getElementById('redoButton');
            if (redoButton) {
                redoButton.addEventListener('click', () => {
                    window.redo();
                });
            }

            document.getElementById('downloadSceneJsonButton').addEventListener('click', () => {
                let filename = prompt("Introduza o nome do ficheiro para exportar:", "cenario");
                if (filename === null) return; // User cancelled
                filename = filename.trim();
                if (filename === "") {
                    filename = "cenario";
                }
                if (!filename.toLowerCase().endsWith('.json')) {
                    filename += '.json';
                }
                const output = JSON.stringify(serializeScenario(), null, 2);
                const blob = new Blob([output], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                link.click();
                URL.revokeObjectURL(url);
            });

            const sceneJsonFileInput = document.getElementById('sceneJsonFileInput');

            document.getElementById('loadSceneJsonButton').addEventListener('click', () => {
                sceneJsonFileInput.value = '';
                sceneJsonFileInput.click();
            });

            sceneJsonFileInput.addEventListener('change', (event) => {
                const file = event.target.files?.[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = () => {
                    try {
                        const data = JSON.parse(String(reader.result));
                        saveHistoryState();
                        loadScenario(data);
                        console.log('Cenário carregado a partir de JSON.');
                    } catch (err) {
                        console.error(err);
                        alert('Não foi possível carregar o JSON do cenário. Verifica o ficheiro e tenta novamente.');
                    }
                };
                reader.readAsText(file);
            });

            // --- WINDOW RESIZING ---
            window.addEventListener('resize', () => {
                resizeViewport();
            });

            // --- RESTORE AUTOSAVED SCENARIO ---
            try {
                const saved = localStorage.getItem('tabletop_autosave');
                if (saved) {
                    const data = JSON.parse(saved);
                    loadScenario(data);
                    console.log('Cenário auto-guardado restaurado.');
                }
            } catch (e) {
                console.warn('Erro ao restaurar cenário auto-guardado:', e);
            }

            isInitializing = false;
            updateHistoryButtons();

            renderer.render(scene, camera);

            function updatePondWaves() {
                const time = Date.now() * 0.003;
                if (typeof ponds === 'undefined') return;
                for (const pond of ponds) {
                    const waterGeo = pond.userData?.waterGeometry;
                    if (!waterGeo) continue;
                    const posAttr = waterGeo.attributes.position;
                    if (!posAttr) continue;
                    for (let i = 0; i < posAttr.count; i++) {
                        const px = posAttr.getX(i);
                        const pz = posAttr.getZ(i);
                        const distFromCenter = Math.sqrt(px * px + pz * pz);
                        // Ondas dinâmicas a propagar-se a partir do centro
                        const wave = Math.sin(distFromCenter * 0.15 - time * 1.5) * 0.5;
                        posAttr.setY(i, wave);
                    }
                    posAttr.needsUpdate = true;
                    waterGeo.computeVertexNormals();
                }
            }

            function updateHumanAnimations(deltaTime) {
                if (typeof humans === 'undefined' || !humans) return;
                for (const human of humans) {
                    if (human.userData.walkCycle === undefined) {
                        human.userData.walkCycle = 0;
                        human.userData.swingAmount = 0;
                    }

                    const isControlled = (humanControlMode && controlledHuman === human);
                    const isMoving = isControlled && 
                        (humanMoveState.forward || humanMoveState.backward || humanMoveState.left || humanMoveState.right) &&
                        (typeof humanCanJump !== 'undefined' ? humanCanJump : true);

                    const targetSwing = isMoving ? 1.0 : 0.0;
                    human.userData.swingAmount = THREE.MathUtils.lerp(human.userData.swingAmount, targetSwing, 10 * deltaTime);

                    if (isMoving) {
                        const speedFactor = (humanControlSettings ? (humanControlSettings.speed / 250) : 1.0);
                        human.userData.walkCycle += deltaTime * 12 * speedFactor;
                    }

                    const swingAmount = human.userData.swingAmount;
                    const walkCycle = human.userData.walkCycle;

                    if (swingAmount > 0.001) {
                        const maxAngle = 0.6; // max swing angle in radians
                        const angle = Math.sin(walkCycle) * maxAngle * swingAmount;

                        if (human.userData.leftLeg) human.userData.leftLeg.rotation.x = angle;
                        if (human.userData.rightLeg) human.userData.rightLeg.rotation.x = -angle;
                        if (human.userData.leftArm) human.userData.leftArm.rotation.x = -angle;
                        if (human.userData.rightArm) human.userData.rightArm.rotation.x = angle;
                    } else {
                        if (human.userData.leftLeg) human.userData.leftLeg.rotation.x = 0;
                        if (human.userData.rightLeg) human.userData.rightLeg.rotation.x = 0;
                        if (human.userData.leftArm) human.userData.leftArm.rotation.x = 0;
                        if (human.userData.rightArm) human.userData.rightArm.rotation.x = 0;
                    }
                }
            }

            // --- ANIMATION LOOP ---
            function animate() {
                requestAnimationFrame(animate);

                const deltaTime = Math.min(clock.getDelta(), 0.05);
                updateHumanControl(deltaTime);
                updateHumanAnimations(deltaTime);

                // Avançar o ciclo dia/noite automático
                if (dayTimeCycleAuto) {
                    // Velocidade: 1 min de jogo por segundo real → dia completo em 24s reais
                    // Multiplicado pela velocidade configurável pelo utilizador
                    dayTimeMinutes = (dayTimeMinutes + deltaTime * 60 * dayCycleSpeedMultiplier) % 1440;
                    applyDayNightCycle(dayTimeMinutes);
                }

                updateSunShadowFocus();
                updatePondWaves();

                const time = Date.now() * 0.003;

                if (dinoData) {
                    const p = dinoData.parts;

                    //Rugir
                    const breatheCycle = Math.sin(time * 0.5);
                    const breatheOffset = breatheCycle * 2;
                    const lookCycle = Math.sin(time * 0.3);

                    let roarFactor = Math.sin(time * 0.4) * 2;
                    roarFactor = Math.max(0, Math.min(1, roarFactor));

                    p.grupoMandibula.rotation.z = roarFactor * 0.05;
                    p.grupoCabecaSuperior.rotation.z = -roarFactor * 0.1;

                    // Iris
                    let targetX = -75;
                    let targetZ1 = 21;
                    let targetZ2 = -21;

                    if (roarFactor > 0.5) {
                        targetX = -75 - 4;
                        targetZ1 = 21 - 1.5;
                        targetZ2 = -21 + 1.5;
                    }

                    p.iris.position.x = THREE.MathUtils.lerp(p.iris.position.x, targetX, 0.1);
                    p.iris.position.z = THREE.MathUtils.lerp(p.iris.position.z, targetZ1, 0.1);

                    p.iris2.position.x = THREE.MathUtils.lerp(p.iris2.position.x, targetX, 0.1);
                    p.iris2.position.z = THREE.MathUtils.lerp(p.iris2.position.z, targetZ2, 0.1);

                    // Cabeça abanar
                    p.grupoCabecaSuperior.rotation.y = lookCycle * 0.1;
                    p.grupoMandibula.rotation.y = lookCycle * 0.1;
                    p.grupoCabecaSuperior.position.y = breatheOffset;
                    p.grupoMandibula.position.y = breatheOffset;
                    p.pescoco.rotation.y = lookCycle * 0.2;


                    // Cauda
                    p.cauda.rotation.y = Math.sin(time) * 0.02;
                    p.cauda.position.z = Math.sin(time) * 0.5;
                    p.cauda2.rotation.y = Math.sin(time - 0.2) * 0.05;
                    p.cauda2.position.z = Math.sin(time - 0.2) * 2;
                    p.cauda3.rotation.y = Math.sin(time - 0.4) * 0.1;
                    p.cauda3.position.z = Math.sin(time - 0.4) * 5;
                    p.cauda4.rotation.y = Math.sin(time - 0.6) * 0.2;
                    p.cauda4.position.z = Math.sin(time - 0.6) * 10;
                    p.cauda5.rotation.y = Math.sin(time - 0.8) * 0.3;
                    p.cauda5.position.z = Math.sin(time - 0.8) * 15;
                    p.cauda6.rotation.y = Math.sin(time - 1.0) * 0.3;
                    p.cauda6.position.z = Math.sin(time - 1.0) * 15;

                    // Respiração
                    const breatheScale = 1 + (breatheCycle * 0.03);

                    p.corpo.scale.set(breatheScale, breatheScale, breatheScale);
                    p.corpo2.scale.set(breatheScale, breatheScale, breatheScale);
                    p.pescoco2.scale.set(breatheScale, breatheScale, breatheScale)

                    p.corpo.position.y = 85 + breatheOffset;
                    p.corpo2.position.y = 100 + breatheOffset;
                    p.pescoco.position.y = 50 + breatheOffset;
                    p.pescoco2.position.y = 65 + breatheOffset;
                    p.braco.position.y = 14 + breatheOffset;
                    p.braco2.position.y = 14 + breatheOffset;
                    p.bracoa.position.y = 32 + breatheOffset;
                    p.bracoa2.position.y = 32 + breatheOffset;

                    p.espinho.position.y = 102 + breatheOffset;
                    p.espinho2.position.y = 130 + breatheOffset;
                    p.espinho3.position.y = 140 + breatheOffset;
                    p.espinho4.position.y = 140 + breatheOffset;
                    p.espinho5.position.y = 138 + breatheOffset;
                    p.espinho6.position.y = 110 + breatheOffset;

                    // Caminhar
                    const walkSpeed = time * 0.6 * movementSpeed;
                    const stepHeight = 15;
                    const strideLength = 15;

                    const phaseRight = Math.sin(walkSpeed);
                    const liftRight = Math.max(0, -Math.cos(walkSpeed));

                    const baseRotationCoxa = Math.PI / 2 + Math.PI / 4;
                    p.coxa2.rotation.z = baseRotationCoxa + (phaseRight * 0.4);
                    p.coxa4.rotation.z = baseRotationCoxa + (phaseRight * 0.4);

                    p.grupopernab.position.x = (phaseRight * strideLength);
                    p.grupopernab.position.y = liftRight * stepHeight;

                    const phaseLeft = -Math.sin(walkSpeed);
                    const liftLeft = Math.max(0, Math.cos(walkSpeed));

                    p.coxa.rotation.z = baseRotationCoxa + (phaseLeft * 0.4);
                    p.coxa3.rotation.z = baseRotationCoxa + (phaseLeft * 0.4);

                    p.grupopernaa.position.x = (phaseLeft * strideLength - 5);
                    p.grupopernaa.position.y = liftLeft * stepHeight;

                }

                if (dino2Data) {
                    const p = dino2Data.parts;

                    // Respirar
                    const breatheCycle = Math.sin(time * 0.5);
                    const breatheOffset = breatheCycle * 0.8;
                    p.torso.position.y = 25 + breatheOffset;

                    // Abanar a cabeça
                    const lookCycle = Math.sin(time * 0.3);
                    p.grupoCabeca.rotation.y = lookCycle * 0.15;
                    p.grupoCabeca.position.y = breatheOffset;

                    // Mover a cauda com clava (efeito chicote ondulado)
                    const tailSwingSpeed = 1.2;
                    const tailSwingAmp = 0.22;
                    const tailSwing = Math.sin(time * tailSwingSpeed) * tailSwingAmp;
                    p.grupoCauda1.rotation.y = tailSwing;
                    p.grupoCauda2.rotation.y = tailSwing * 0.8;
                    p.grupoCauda3.rotation.y = tailSwing * 0.6;
                    p.grupoCauda4.rotation.y = tailSwing * 0.45;

                    // Caminhar (quadrúpede)
                    const walkSpeed = time * 0.8 * movementSpeed;
                    const legSwing = Math.sin(walkSpeed) * 0.35;

                    // As coxas rodam (limitando a rotação para trás para ser mais realista e evitar clipar com o corpo)
                    let swingFL_BR = legSwing;
                    if (swingFL_BR > 0) swingFL_BR *= 0.25;

                    let swingFR_BL = -legSwing;
                    if (swingFR_BL > 0) swingFR_BL *= 0.25;

                    if (p.grupoCoxaFL) {
                        p.grupoCoxaFL.rotation.z = swingFL_BR;
                        p.grupoCoxaBR.rotation.z = swingFL_BR;
                        p.grupoCoxaFR.rotation.z = swingFR_BL;
                        p.grupoCoxaBL.rotation.z = swingFR_BL;

                        p.grupoCoxaFL.position.y = 18 + breatheOffset;
                        p.grupoCoxaBR.position.y = 18 + breatheOffset;
                        p.grupoCoxaFR.position.y = 18 + breatheOffset;
                        p.grupoCoxaBL.position.y = 18 + breatheOffset;
                    }

                    // As canelas, pés e garras ficam retos (sem rodar) e apenas transladam em X e Y
                    p.grupoPernaFL.rotation.z = 0;
                    p.grupoPernaBR.rotation.z = 0;
                    p.grupoPernaFR.rotation.z = 0;
                    p.grupoPernaBL.rotation.z = 0;

                    p.grupoPernaFL.position.x = -35 + Math.sin(swingFL_BR) * 24;
                    p.grupoPernaBR.position.x = 30 + Math.sin(swingFL_BR) * 24;
                    p.grupoPernaFR.position.x = -35 + Math.sin(swingFR_BL) * 24;
                    p.grupoPernaBL.position.x = 30 + Math.sin(swingFR_BL) * 24;

                    const liftFL = Math.max(0, -Math.cos(walkSpeed)) * 4.5;
                    const liftBR = Math.max(0, -Math.cos(walkSpeed)) * 4.5;
                    const liftFR = Math.max(0, Math.cos(walkSpeed)) * 4.5;
                    const liftBL = Math.max(0, Math.cos(walkSpeed)) * 4.5;

                    p.grupoPernaFL.position.y = 18 + liftFL + breatheOffset;
                    p.grupoPernaBR.position.y = 18 + liftBR + breatheOffset;
                    p.grupoPernaFR.position.y = 18 + liftFR + breatheOffset;
                    p.grupoPernaBL.position.y = 18 + liftBL + breatheOffset;
                }

                updateAmbientTumbleweeds(deltaTime);

                // Atualizar outline para seguir o modelo selecionado
                if (selectionOutline && selectionOutline.visible && selectedObject) {
                    // Os outlines agora são filhos dos meshes e herdam transformações automaticamente
                }

                // Billboard: sol e lua olham sempre para a câmara
                if (sunMesh.visible) {
                    sunMesh.lookAt(camera.position);
                }
                if (moonMesh.visible) {
                    moonMesh.lookAt(camera.position);
                }

                if (!humanControlMode) {
                    controls.update();
                }
                renderer.render(scene, camera);
            }

            animate();
        }

        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            init();
        } else {
            window.addEventListener('DOMContentLoaded', init);
        }
    </script>
