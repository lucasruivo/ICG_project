<!DOCTYPE html>
<html lang="en">

<head>
    <title>3D Tabletop Editor</title>
    <meta charset="utf-8">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background: #1b2632;
        }

        /* Barra Lateral */
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: #2c3e50;
            color: white;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            overflow-x: hidden;
            transition: transform 0.25s ease;
            will-change: transform;
        }

        #sidebar.hidden {
            transform: translateX(-100%);
            pointer-events: none;
        }

        #sidebar::-webkit-scrollbar-track {
            background: #34495e;
        }

        #sidebar::-webkit-scrollbar-thumb {
            background: #7f8c8d;
            border-radius: 4px;
        }

        #sidebar::-webkit-scrollbar-thumb:hover {
            background: #95a5a6;
        }

        #viewport {
            position: absolute;
            inset: 0;
        }

        .menu-section {
            border-bottom: 1px solid #555;
            padding-bottom: 15px;
        }

        h3 {
            margin-top: 0;
            color: #ecf0f1;
            font-size: 18px;
        }

        .model-item {
            background: hsl(210, 49%, 48%);
            padding: 10px;
            margin: 5px 0;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
            transition: background 0.2s;
        }

        .model-item:hover {
            background: #45a049;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            cursor: pointer;
            border: none;
        }

        .terrain-tone-control {
            margin-top: 10px;
        }

        .terrain-tone-control label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: #ecf0f1;
        }

        .texture-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .texture-slot {
            position: relative;
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            overflow: hidden;
            background: #243446;
            box-shadow: inset 0 -50px 40px rgba(0, 0, 0, 0.25);
        }

        .texture-slot-main {
            position: absolute;
            inset: 0;
            border: 0;
            background-size: cover;
            background-position: center;
            color: #fff;
            font-weight: 700;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            padding: 10px;
        }

        .texture-slot-main::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.08));
        }

        .texture-slot-main span {
            position: relative;
            z-index: 1;
        }

        .texture-slot.active {
            outline: 2px solid #f1c40f;
            box-shadow: 0 0 0 2px rgba(241, 196, 15, 0.35), inset 0 -50px 40px rgba(0, 0, 0, 0.25);
        }

        .texture-slot-empty {
            background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.08) 75%, transparent 75%, transparent);
            background-size: 18px 18px;
        }

        .texture-slot-edit {
            position: absolute;
            right: 8px;
            top: 8px;
            z-index: 2;
            border: none;
            border-radius: 999px;
            padding: 6px 9px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            cursor: pointer;
            font-size: 11px;
        }

        .texture-slot-edit:hover {
            background: rgba(0, 0, 0, 0.78);
        }

        .action-button {
            padding: 10px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 8px;
        }

        .action-button.secondary {
            background: #2980b9;
        }

        .action-button.tertiary {
            background: #16a085;
        }

        .action-button.danger {
            background: #c0392b;
        }

        .action-button.active {
            outline: 2px solid #f1c40f;
            box-shadow: 0 0 0 2px rgba(241, 196, 15, 0.35);
        }

        /* Controles de Terreno */
        .terrain-control {
            margin-bottom: 12px;
        }

        .terrain-control label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: #ecf0f1;
        }

        /* Acordeão de pedras */
        .menu-section .model-item {
            font-size: 14px;
            padding: 12px;
        }

        .accordion-header {
            background: hsl(210, 49%, 48%);
            padding: 10px;
            margin: 5px 0;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            user-select: none;
        }

        .accordion-header:hover {
            background: #45a049;
        }

        .accordion-chevron {
            font-size: 11px;
            transition: transform 0.2s;
        }

        .accordion-chevron.open {
            transform: rotate(90deg);
        }

        .accordion-body {
            display: none;
            padding-left: 8px;
        }

        .accordion-body.open {
            display: block;
        }

        .accordion-body .model-item {
            font-size: 13px;
        }
    </style>
</head>

<body>
    <div id="sidebar">
        <div class="menu-section">
            <h3>Cenário</h3>
            <label>Texturas do Terreno:</label>
            <div class="texture-grid">
                <div class="texture-slot active" id="terrainTextureSlot0Card">
                    <button type="button" class="texture-slot-main" id="terrainTextureSlot0Button"
                        onclick="setTerrainTextureSlot(0)">
                        <span>Textura 1</span>
                    </button>
                    <button type="button" class="texture-slot-edit" onclick="editTerrainTextureSlot(0)">Editar
                        URL</button>
                </div>
                <div class="texture-slot" id="terrainTextureSlot1Card">
                    <button type="button" class="texture-slot-main" id="terrainTextureSlot1Button"
                        onclick="setTerrainTextureSlot(1)">
                        <span>Textura 2</span>
                    </button>
                    <button type="button" class="texture-slot-edit" onclick="editTerrainTextureSlot(1)">Editar

                </div>
                <div class="texture-slot" id="terrainTextureSlot2Card">
                    <button type="button" class="texture-slot-main texture-slot-empty" id="terrainTextureSlot2Button"

                        <span>Textura 3</span>
                    </button>
                    <button type="button" class="texture-slot-edit" onclick="editTerrainTextureSlot(2)">Editar

                </div>
                <div class="texture-slot" id="terrainTextureSlot3Card">
                    <button type="button" class="texture-slot-main texture-slot-empty" id="terrainTextureSlot3Button"
                        onclick="setTerrainTextureSlot(3)">
                        <span>Textura 4</span>
                    </button>
                    <button type="button" class="texture-slot-edit" onclick="editTerrainTextureSlot(3)">Editar
                        URL</button>
                </div>
            </div>
            <div class="terrain-tone-control">
                <label for="terrainTintColor">Tom do Terreno:</label>
                <input type="color" id="terrainTintColor" value="#ffffff">
            </div>
        </div>

        <div class="menu-section">
            <h3>Modelos</h3>
            <div class="model-item" onclick="addDino()">Dinossauro T-Rex</div>
            <div class="model-item" onclick="addDino2()">Dinossauro Ankylosaurus</div>
            <div class="model-item" onclick="addTree()">Árvore</div>
            <!-- <div class="model-item" onclick="addGrass()">Ervinhas</div> -->
            <div class="model-item" onclick="addHuman()">Ser Humano</div>
            <div class="model-item" onclick="addCact()">Cacto</div>

            <div class="accordion-header" onclick="toggleRockAccordion(this)">
                <span>Pedra</span>
                <span class="accordion-chevron">&#9654;</span>
            </div>
            <div class="accordion-body" id="rockAccordion">
                <div class="model-item" onclick="addRock('small')">Pedra Pequena</div>
                <div class="model-item" onclick="addRock('medium')">Pedra Média</div>
                <div class="model-item" onclick="addRock('large')">Pedra Grande</div>
            </div>
        </div>

        <button id="bushToggleButton" class="action-button tertiary">Bushes no Mapa: OFF</button>
        <button id="grassToggleButton" class="action-button tertiary">Erva no Mapa: OFF</button>
        <button id="tumbleweedToggleButton" class="action-button">Tumbleweeds no Mapa: OFF</button>

        <button id="clearSceneButton" class="action-button danger">Limpar Cenário</button>

        <button id="downloadSceneJsonButton" class="action-button secondary">Download Cenário JSON</button>
        <button id="loadSceneJsonButton" class="action-button tertiary">Load Cenário JSON</button>
        <button id="deleteModeButton" class="action-button danger">Modo Apagar: OFF</button>
        <button id="humanControlButton" class="action-button secondary">Entrar no Humano (F)</button>
        <input type="file" id="sceneJsonFileInput" accept="application/json" style="display: none;">
    </div>

    <div id="contextMenu"
        style="display: none; position: absolute; background: rgba(44, 62, 80, 0.95); border: 1px solid #f1c40f; border-radius: 8px; padding: 15px; width: 220px; z-index: 1000; color: white; box-shadow: 0 4px 15px rgba(0,0,0,0.5); backdrop-filter: blur(4px);">
        <h3 id="contextTitle"
            style="color: #f1c40f; font-size: 14px; margin-top: 0; margin-bottom: 15px; border-bottom: 1px solid #555; padding-bottom: 5px;">
            Editar Objeto</h3>

        <div class="terrain-control">
            <label>Tamanho: <span id="ctxScaleValue">1.0</span>x</label>
            <input type="range" id="ctxScaleSlider" min="0.1" max="5" step="0.1" value="1" style="width: 100%;">
        </div>

        <div class="terrain-control" style="margin-top: 10px;">
            <label>Rotação (Eixo Y): <span id="ctxRotationValue">0</span>°</label>
            <input type="range" id="ctxRotationSlider" min="0" max="360" step="1" value="0" style="width: 100%;">
        </div>

        <button id="ctxCloseBtn"
            style="margin-top: 15px; width: 100%; padding: 6px; background: #c0392b; color: white; border: none; border-radius: 4px; cursor: pointer;">Fechar
            Menu</button>
    </div>

    <div id="viewport"></div>
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                 "three": "https://threejs.org/build/three.module.js",
                 "three/addons/": "https://threejs.org/examples/jsm/"
            }
        }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Cache-busting dynamic imports for local modules to prevent browser caching issues in Live Server
        const v = Date.now();
        const { createDino } = await import(`./dino.js?v=${v}`);
        const { createDino2 } = await import(`./dino2.js?v=${v}`);
        const { createTerrain } = await import(`./terrain.js?v=${v}`);
        const { createTree } = await import(`./tree.js?v=${v}`);
        const { createForestGrass } = await import(`./grass.js?v=${v}`);
        const { createBush } = await import(`./bush.js?v=${v}`);
        const { createRock } = await import(`./lrock.js?v=${v}`);
        const { createTumbleweed } = await import(`./tumbleweed.js?v=${v}`);
        const { createHuman } = await import(`./human.js?v=${v}`);
        const { createCact } = await import(`./cact.js?v=${v}`);

        let dinoData;
        let dino2Data;
        let isInitializing = true;
        let isLoadingScenario = false;
        let scene;
        let terrain;
        let auraLight;
        let trees = [];
        let grasses = [];
        let bushes = [];
        let rocks = [];
        let tumbleweeds = [];
        let humans = [];
        let cacts = [];
        const humanWorldScale = new THREE.Vector3();
        const collisionWorldScale = new THREE.Vector3();
        const collisionFallbackCenter = new THREE.Vector3();
        // When true, adjust collision radii so they match the model's apparent
        // screen size (reduces perceived overlap when camera is far).
        const collisionUseScreenScale = true;
        const collisionScreenRefDistance = 420; // reference distance where scale==1
        const SCENE_EXPORT_VERSION = 1;
        let bushEffectEnabled = false;
        let bushToggleButton = null;
        let grassEffectEnabled = false;
        let grassToggleButton = null;
        let tumbleweedEffectEnabled = false;
        let tumbleweedSpawnTimer = 0;
        let tumbleweedToggleButton = null;
        let deleteMode = false;
        let isDragging = false;
        let movementSpeed = 1.0;
        let humanControlMode = false;
        let controlledHuman = null;
        let humanYaw = 0;
        let humanPitch = 0;
        let humanVerticalVelocity = 0;
        let humanCanJump = false;
        const terrainTextureLoader = new THREE.TextureLoader();
        terrainTextureLoader.setCrossOrigin('anonymous');
        const terrainTextureCache = new Map();
        const terrainTextureSlots = [
            { label: 'Textura 1', url: 'https://static4.depositphotos.com/1011255/274/i/450/depositphotos_2747178-stock-photo-soil-background.jpg' },
            { label: 'Textura 2', url: 'https://www.manytextures.com/wallpaper/1/1050/1680/green-grass-wallpaper.jpg' },
            { label: 'Textura 3', url: 'https://images-wixmp-ed30a86b8c4ca887773594c2.wixmp.com/f/70505a3b-10b9-40fa-9297-9e932a6f5596/d19w0ke-0c5e53d4-8f24-4cce-bf78-5d0242ce1872.jpg?token=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJzdWIiOiJ1cm46YXBwOjdlMGQxODg5ODIyNjQzNzNhNWYwZDQxNWVhMGQyNmUwIiwiaXNzIjoidXJuOmFwcDo3ZTBkMTg4OTgyMjY0MzczYTVmMGQ0MTVlYTBkMjZlMCIsIm9iaiI6W1t7InBhdGgiOiIvZi83MDUwNWEzYi0xMGI5LTQwZmEtOTI5Ny05ZTkzMmE2ZjU1OTYvZDE5dzBrZS0wYzVlNTNkNC04ZjI0LTRjY2UtYmY3OC01ZDAyNDJjZTE4NzIuanBnIn1dXSwiYXVkIjpbInVybjpzZXJ2aWNlOmZpbGUuZG93bmxvYWQiXX0.uJODMNuBNj3HfmLZFd59y1ffLDkk3_wIogSFXPrF5uo' },
            { label: 'Textura 4', url: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRCfBuPYZoG-_VBqLJnSTKgRW87sy2dGqtArw&s' },
        ];
        const terrainTextureButtons = [null, null, null, null];
        const terrainTextureCards = [null, null, null, null];
        let terrainActiveTextureSlotIndex = 0;
        let terrainTintColor = '#ffffff';

        const TERRAIN_TEXTURE_PRESETS = {
            grass: {
                roughness: 0.8,
                label: 'Relvosa',
            },
            sand: {
                roughness: 0.95,
                label: 'Areosa',
            },
            rocky: {
                roughness: 0.75,
                label: 'Pedrosa',
            },
            mixed: {
                roughness: 0.85,
                label: 'Mista',
            },
            thyme: {
                roughness: 0.98,
                label: 'Relva seca',
                mapUrl: 'https://static4.depositphotos.com/1011255/274/i/450/depositphotos_2747178-stock-photo-soil-background.jpg',
            },
            stone: {
                roughness: 0.98,
                label: 'Pedrosa',
                mapUrl: 'https://as1.ftcdn.net/jpg/02/29/39/48/1000_F_229394888_qsno5pKbbcMJAZPs1IbHImp7sowUKF90.jpg',
            },
        };

        const BUSH_EFFECT_SETTINGS = {
            count: 96,
            edgeMargin: 90,
            positionJitter: 0.16,
        };

        const TUMBLEWEED_EFFECT_SETTINGS = {
            maxActive: 30,
            initialSeedCount: 18,
            minSpawnInterval: 0.35,
            maxSpawnInterval: 0.8,
            cornerMargin: 40,
            lateralSpreadFactor: 1.34,
            despawnPadding: 220,
            pathDistanceJitter: 110,
            spawnBoundsInset: 40,
            seedProgressJitter: 0.04,
            seedLateralJitter: 0.16,
        };

        function getTerrainBounds() {
            if (!terrain) return null;

            terrain.updateMatrixWorld(true);
            return new THREE.Box3().setFromObject(terrain);
        }

        function getHaltonValue(index, base) {
            let result = 0;
            let factor = 1 / base;
            let current = index;

            while (current > 0) {
                result += factor * (current % base);
                current = Math.floor(current / base);
                factor /= base;
            }

            return result;
        }

        function jitterNormalized(value, amount) {
            return THREE.MathUtils.clamp(value + (Math.random() - 0.5) * amount, 0, 1);
        }

        function mapNormalizedToTerrainXZ(normalizedX, normalizedZ, inset = 0) {
            const bounds = getTerrainBounds();
            if (!bounds) return null;

            return new THREE.Vector2(
                THREE.MathUtils.lerp(bounds.min.x + inset, bounds.max.x - inset, normalizedX),
                THREE.MathUtils.lerp(bounds.min.z + inset, bounds.max.z - inset, normalizedZ)
            );
        }

        function clampPointToTerrainBounds(point, inset = 0) {
            const bounds = getTerrainBounds();
            if (!bounds) return point;

            point.x = THREE.MathUtils.clamp(point.x, bounds.min.x + inset, bounds.max.x - inset);
            point.y = THREE.MathUtils.clamp(point.y, bounds.min.z + inset, bounds.max.z - inset);
            return point;
        }

        function getTumbleweedFlow() {
            const bounds = getTerrainBounds();
            if (!bounds) return null;

            const width = bounds.max.x - bounds.min.x;
            const depth = bounds.max.z - bounds.min.z;
            const margin = Math.min(
                TUMBLEWEED_EFFECT_SETTINGS.cornerMargin,
                width * 0.12,
                depth * 0.12
            );
            const start = new THREE.Vector2(bounds.min.x + margin, bounds.min.z + margin);
            const end = new THREE.Vector2(bounds.max.x - margin, bounds.max.z - margin);
            const direction = end.clone().sub(start).normalize();
            const lateral = new THREE.Vector2(-direction.y, direction.x);

            return {
                bounds,
                start,
                direction,
                pathLength: start.distanceTo(end),
                lateralSpread: Math.min(width, depth) * TUMBLEWEED_EFFECT_SETTINGS.lateralSpreadFactor * 0.5,
                lateral,
            };
        }

        function randomTumbleweedSpawnInterval() {
            const { minSpawnInterval, maxSpawnInterval } = TUMBLEWEED_EFFECT_SETTINGS;
            return minSpawnInterval + Math.random() * (maxSpawnInterval - minSpawnInterval);
        }

        function applyTerrainTintColor(color) {
            terrainTintColor = color;
            if (terrain?.material) {
                terrain.material.color.set(color);
            }
            const tintInput = document.getElementById('terrainTintColor');
            if (tintInput && tintInput.value !== color) {
                tintInput.value = color;
            }
        }

        function loadTerrainTextureFromUrl(url) {
            if (!url) return null;

            let texture = terrainTextureCache.get(url);
            if (!texture) {
                texture = terrainTextureLoader.load(url);
                texture.colorSpace = THREE.SRGBColorSpace;
                texture.wrapS = THREE.RepeatWrapping;
                texture.wrapT = THREE.RepeatWrapping;
                texture.repeat.set(10, 10);
                terrainTextureCache.set(url, texture);
            }
            return texture;
        }

        function refreshTerrainTextureSlotUI() {
            for (let i = 0; i < terrainTextureSlots.length; i++) {
                const slot = terrainTextureSlots[i];
                const card = terrainTextureCards[i];
                const button = terrainTextureButtons[i];
                if (!card || !button) continue;

                card.classList.toggle('active', i === terrainActiveTextureSlotIndex);
                button.style.backgroundImage = slot.url ? `url('${slot.url}')` : '';
                button.classList.toggle('texture-slot-empty', !slot.url);
                const label = button.querySelector('span');
                if (label) label.textContent = slot.label;
            }
        }

        function applyTerrainTextureSlot(index) {
            const slot = terrainTextureSlots[index];
            if (!slot) return;

            terrainActiveTextureSlotIndex = index;
            if (terrain?.material) {
                terrain.material.map = loadTerrainTextureFromUrl(slot.url);
                terrain.material.color.set(terrainTintColor);
                terrain.material.needsUpdate = true;
            }
            refreshTerrainTextureSlotUI();
            if (typeof autoSaveScenario === 'function') autoSaveScenario();
        }

        function editTerrainTextureSlot(index) {
            const slot = terrainTextureSlots[index];
            if (!slot) return;

            const nextUrl = window.prompt(`Cola a URL da textura para ${slot.label}:`, slot.url || '');
            if (nextUrl === null) return;

            slot.url = nextUrl.trim();
            if (index === terrainActiveTextureSlotIndex) {
                applyTerrainTextureSlot(index);
            } else {
                refreshTerrainTextureSlotUI();
            }
            if (typeof autoSaveScenario === 'function') autoSaveScenario();
        }

        window.setTerrainTextureSlot = applyTerrainTextureSlot;
        window.editTerrainTextureSlot = editTerrainTextureSlot;
        window.setTerrainTexture = function (textureRef) {
            if (typeof textureRef === 'number') {
                applyTerrainTextureSlot(textureRef);
                return;
            }

            const legacyMap = {
                thyme: 0,
                grass: 0,
                stone: 1,
                rocky: 1,
                sand: 2,
                mixed: 3,
            };

            if (Object.prototype.hasOwnProperty.call(legacyMap, textureRef)) {
                applyTerrainTextureSlot(legacyMap[textureRef]);
            }
        };

        function updateBushToggleButton() {
            if (!bushToggleButton) return;

            bushToggleButton.textContent = `Bushes no Mapa: ${bushEffectEnabled ? 'ON' : 'OFF'}`;
            bushToggleButton.classList.toggle('active', bushEffectEnabled);
        }

        function clearAmbientBushes() {
            for (const bush of bushes) {
                scene?.remove(bush);
            }
            bushes.length = 0;
        }

        function spawnAmbientBush(options = {}) {
            const {
                normalizedX = Math.random(),
                normalizedZ = Math.random(),
            } = options;
            const position2D = mapNormalizedToTerrainXZ(
                normalizedX,
                normalizedZ,
                BUSH_EFFECT_SETTINGS.edgeMargin
            );
            if (!position2D || !scene) return null;

            const bush = createBush();
            bush.position.set(position2D.x, 0, position2D.y);
            bush.rotation.y = Math.random() * Math.PI * 2;
            bush.userData.draggable = false;
            bush.userData.ignoreSceneTools = true;

            disableShadows(bush);
            scene.add(bush);
            snapObjectToTerrain(bush);
            bushes.push(bush);
            return bush;
        }

        function seedAmbientBushes() {
            for (let i = 0; i < BUSH_EFFECT_SETTINGS.count; i++) {
                spawnAmbientBush({
                    normalizedX: jitterNormalized(getHaltonValue(i + 1, 2), BUSH_EFFECT_SETTINGS.positionJitter),
                    normalizedZ: jitterNormalized(getHaltonValue(i + 1, 3), BUSH_EFFECT_SETTINGS.positionJitter),
                });
            }
        }

        function setBushEffectEnabled(enabled) {
            bushEffectEnabled = Boolean(enabled);
            clearAmbientBushes();

            if (bushEffectEnabled) {
                seedAmbientBushes();
            }

            updateBushToggleButton();
            if (typeof autoSaveScenario === 'function') autoSaveScenario();
        }

        const GRASS_EFFECT_SETTINGS = {
            count: 128,
            edgeMargin: 90,
            positionJitter: 0.16,
        };

        function updateGrassToggleButton() {
            if (!grassToggleButton) return;

            grassToggleButton.textContent = `Erva no Mapa: ${grassEffectEnabled ? 'ON' : 'OFF'}`;
            grassToggleButton.classList.toggle('active', grassEffectEnabled);
        }

        function clearAmbientGrasses() {
            for (const grass of grasses.filter(g => g.userData?.isAmbientGrass)) {
                scene?.remove(grass);
            }
            grasses = grasses.filter(g => !g.userData?.isAmbientGrass);
        }

        function spawnAmbientGrass(options = {}) {
            const {
                normalizedX = Math.random(),
                normalizedZ = Math.random(),
            } = options;
            const position2D = mapNormalizedToTerrainXZ(
                normalizedX,
                normalizedZ,
                GRASS_EFFECT_SETTINGS.edgeMargin
            );
            if (!position2D || !scene) return null;

            const grass = createForestGrass();
            grass.position.set(position2D.x, 0, position2D.y);
            grass.rotation.y = Math.random() * Math.PI * 2;
            grass.userData.draggable = false;
            grass.userData.ignoreSceneTools = true;
            grass.userData.isAmbientGrass = true;

            disableShadows(grass);
            scene.add(grass);
            snapObjectToTerrain(grass);
            grasses.push(grass);
            return grass;
        }

        function seedAmbientGrasses() {
            for (let i = 0; i < GRASS_EFFECT_SETTINGS.count * 3; i++) {
                spawnAmbientGrass({
                    normalizedX: jitterNormalized(getHaltonValue(i + 1, 2), GRASS_EFFECT_SETTINGS.positionJitter),
                    normalizedZ: jitterNormalized(getHaltonValue(i + 1, 3), GRASS_EFFECT_SETTINGS.positionJitter),
                });
            }
        }

        function setGrassEffectEnabled(enabled) {
            grassEffectEnabled = Boolean(enabled);
            clearAmbientGrasses();

            if (grassEffectEnabled) {
                seedAmbientGrasses();
            }

            updateGrassToggleButton();
            if (typeof autoSaveScenario === 'function') autoSaveScenario();
        }

        function getDistributedTumbleweedLateralBias(index, total) {
            if (total <= 1) return 0;

            const goldenRatioConjugate = 0.61803398875;
            const normalized = (index * goldenRatioConjugate) % 1;
            return normalized * 2 - 1;
        }

        function updateTumbleweedToggleButton() {
            if (!tumbleweedToggleButton) return;

            tumbleweedToggleButton.textContent = `Tumbleweeds no Mapa: ${tumbleweedEffectEnabled ? 'ON' : 'OFF'}`;
            tumbleweedToggleButton.classList.toggle('active', tumbleweedEffectEnabled);
        }

        function clearAmbientTumbleweeds() {
            for (const tw of tumbleweeds) {
                scene?.remove(tw);
            }
            tumbleweeds.length = 0;
        }

        function spawnAmbientTumbleweed(options = {}) {
            const {
                progressRatio = 0,
                progressJitterRatio = 0,
                lateralBias = null,
                lateralJitter = 0,
            } = options;
            const flow = getTumbleweedFlow();
            if (!flow || !scene) return null;

            const tw = createTumbleweed();
            const normalizedProgress = THREE.MathUtils.clamp(
                progressRatio + (Math.random() - 0.5) * progressJitterRatio,
                0,
                1
            );
            const normalizedLateral = lateralBias === null
                ? (Math.random() * 2 - 1)
                : THREE.MathUtils.clamp(
                    lateralBias + (Math.random() - 0.5) * lateralJitter,
                    -1,
                    1
                );
            const lateralOffset = normalizedLateral * flow.lateralSpread;
            const pathJitter = (Math.random() - 0.5) * TUMBLEWEED_EFFECT_SETTINGS.pathDistanceJitter;
            const distanceAlongPath = THREE.MathUtils.clamp(
                flow.pathLength * normalizedProgress + pathJitter,
                0,
                flow.pathLength
            );
            const spawnPosition = flow.start.clone()
                .addScaledVector(flow.direction, distanceAlongPath)
                .addScaledVector(flow.lateral, lateralOffset);
            clampPointToTerrainBounds(spawnPosition, TUMBLEWEED_EFFECT_SETTINGS.spawnBoundsInset);

            const baseSpeed = 1.55 + Math.random() * 0.8;
            const sideDrift = (Math.random() - 0.5) * 0.08;
            const drift2D = flow.direction.clone().multiplyScalar(baseSpeed)
                .addScaledVector(flow.lateral, sideDrift);

            tw.position.set(spawnPosition.x, 0, spawnPosition.y);
            tw.userData.draggable = false;
            tw.userData.ignoreSceneTools = true;
            tw.userData.flowStart = flow.start.clone();
            tw.userData.flowDirection2D = flow.direction.clone();
            tw.userData.pathLength = flow.pathLength;
            tw.userData.despawnPadding = TUMBLEWEED_EFFECT_SETTINGS.despawnPadding;
            tw.userData.wind = drift2D;
            tw.userData.rollAxis = new THREE.Vector3(flow.direction.y, 0, -flow.direction.x)
                .add(new THREE.Vector3((Math.random() - 0.5) * 0.15, 0, (Math.random() - 0.5) * 0.15))
                .normalize();
            tw.userData.rollSpeed = 0.08 + Math.random() * 0.04;
            tw.userData.jumpHeight = 0;
            tw.userData.jumpVelocity = 0;
            tw.userData.nextJumpAt = Date.now() + 600 + Math.random() * 2200;

            disableShadows(tw);
            scene.add(tw);
            snapObjectToTerrain(tw);
            tumbleweeds.push(tw);
            return tw;
        }

        function seedAmbientTumbleweeds() {
            const count = TUMBLEWEED_EFFECT_SETTINGS.initialSeedCount;

            for (let i = 0; i < count; i++) {
                spawnAmbientTumbleweed({
                    progressRatio: (i + 0.5) / count,
                    progressJitterRatio: TUMBLEWEED_EFFECT_SETTINGS.seedProgressJitter,
                    lateralBias: getDistributedTumbleweedLateralBias(i, count),
                    lateralJitter: TUMBLEWEED_EFFECT_SETTINGS.seedLateralJitter,
                });
            }
        }

        function setTumbleweedEffectEnabled(enabled) {
            tumbleweedEffectEnabled = Boolean(enabled);
            tumbleweedSpawnTimer = tumbleweedEffectEnabled ? randomTumbleweedSpawnInterval() : 0;
            clearAmbientTumbleweeds();

            if (tumbleweedEffectEnabled) {
                seedAmbientTumbleweeds();
            }

            updateTumbleweedToggleButton();
            if (typeof autoSaveScenario === 'function') autoSaveScenario();
        }

        window.setBushEffectEnabled = setBushEffectEnabled;
        window.toggleBushEffect = function () {
            setBushEffectEnabled(!bushEffectEnabled);
        };
        window.setGrassEffectEnabled = setGrassEffectEnabled;
        window.toggleGrassEffect = function () {
            setGrassEffectEnabled(!grassEffectEnabled);
        };
        window.setTumbleweedEffectEnabled = setTumbleweedEffectEnabled;
        window.toggleTumbleweedEffect = function () {
            setTumbleweedEffectEnabled(!tumbleweedEffectEnabled);
        };

        function createModelOutline(mesh) {
            // Criar outline que segue o contorno real do modelo
            if (!mesh.geometry) return null;

            const edges = new THREE.EdgesGeometry(mesh.geometry, 10); // 10 graus de threshold
            const material = new THREE.LineBasicMaterial({
                color: 0xFFFFFF,  // Vermelho
                linewidth: 4,
                transparent: true,
                opacity: 0.9,
                fog: false,
                depthTest: true,
                depthWrite: false
            });
            const outline = new THREE.LineSegments(edges, material);
            outline.userData.isBillboard = true;
            return outline;
        }

        function applyShadowSettings(object3D) {
            object3D.traverse(obj => {
                if (obj.isMesh) {
                    // Proteger meshes de olhos/íris: já têm configurações próprias
                    if (obj.userData?.isEyeMesh) return;
                    obj.castShadow = true;
                    obj.receiveShadow = true;
                }
            });
        }

        function disableShadows(object3D) {
            object3D.traverse(obj => {
                if (obj.isMesh) {
                    obj.castShadow = false;
                    obj.receiveShadow = false;
                }
            });
        }

        function applyTransform(object3D, transform) {
            if (!transform) return;

            if (transform.position) {
                object3D.position.set(
                    Number(transform.position.x ?? object3D.position.x),
                    Number(transform.position.y ?? object3D.position.y),
                    Number(transform.position.z ?? object3D.position.z)
                );
            }

            if (transform.rotation) {
                object3D.rotation.set(
                    Number(transform.rotation.x ?? object3D.rotation.x),
                    Number(transform.rotation.y ?? object3D.rotation.y),
                    Number(transform.rotation.z ?? object3D.rotation.z)
                );
            }

            if (transform.scale) {
                object3D.scale.set(
                    Number(transform.scale.x ?? object3D.scale.x),
                    Number(transform.scale.y ?? object3D.scale.y),
                    Number(transform.scale.z ?? object3D.scale.z)
                );
            }
        }

        function getObjectBounds(object3D) {
            if (!object3D) return null;

            object3D.updateMatrixWorld(true);
            const bbox = new THREE.Box3().setFromObject(object3D);
            return bbox.isEmpty() ? null : bbox;
        }

        function getObjectBottomY(object3D) {
            const bbox = getObjectBounds(object3D);
            return bbox ? bbox.min.y : null;
        }

        function getTerrainHeightAt(x, z, raycasterInstance = null) {
            if (!terrain) return null;

            const downRay = raycasterInstance ?? new THREE.Raycaster();
            downRay.set(
                new THREE.Vector3(x, 500, z),
                new THREE.Vector3(0, -1, 0)
            );

            const hit = downRay.intersectObject(terrain);
            return hit.length > 0 ? hit[0].point.y : null;
        }

        function getTerrainSurfaceOffset(object3D) {
            if (!object3D) return 0;

            return object3D.userData.terrainSurfaceOffset
                ?? (object3D.name === 'Tumbleweed' ? (object3D.userData.groundOffset ?? 0) : 0);
        }

        function alignObjectBottomToWorldY(object3D, targetBottomY) {
            const currentBottomY = getObjectBottomY(object3D);
            if (currentBottomY === null) return;

            object3D.position.y += targetBottomY - currentBottomY;
            object3D.updateMatrixWorld(true);
        }

        function getPlacementClearance(object3D) {
            const currentBottomY = getObjectBottomY(object3D);
            if (currentBottomY === null) return 0;

            return (object3D.position.y - currentBottomY) + getTerrainSurfaceOffset(object3D);
        }

        function snapObjectToTerrain(object3D) {
            if (!object3D || !terrain) return;

            const groundY = getTerrainHeightAt(object3D.position.x, object3D.position.z);
            if (groundY === null) return;

            alignObjectBottomToWorldY(object3D, groundY + getTerrainSurfaceOffset(object3D));
        }

        function getHumanCameraEyeWorldPosition(human, target) {
            if (!human) return target;

            const cameraAnchor = human.userData?.cameraAnchor;
            if (cameraAnchor?.getWorldPosition) {
                human.updateMatrixWorld(true);
                cameraAnchor.getWorldPosition(target);
                return target;
            }

            const humanBounds = getObjectBounds(human);
            if (!humanBounds) {
                target.copy(human.position);
                return target;
            }

            const height = humanBounds.max.y - humanBounds.min.y;
            target.set(
                human.position.x,
                humanBounds.min.y + height * 0.78,
                human.position.z
            );
            return target;
        }

        function getHumanCameraForwardOffset(human) {
            if (!human) return 1.5;

            human.getWorldScale(humanWorldScale);
            return Math.max(1.2, Math.abs(humanWorldScale.z) * 0.8);
        }

        function getWorldCollisionCircles(object3D, translation = null) {
            if (!object3D) return [];

            const collisionCircles = Array.isArray(object3D.userData?.collisionCircles)
                ? object3D.userData.collisionCircles
                : null;

            if (!collisionCircles || collisionCircles.length === 0) {
                const bbox = getObjectBounds(object3D);
                if (!bbox) return [];

                const halfWidth = (bbox.max.x - bbox.min.x) * 0.5;
                const halfDepth = (bbox.max.z - bbox.min.z) * 0.5;
                const radius = Math.sqrt(Math.max(halfWidth, 0.01) * Math.max(halfDepth, 0.01));
                bbox.getCenter(collisionFallbackCenter);

                // compute optional screen-scale based on camera distance
                let screenScale = 1;
                if (collisionUseScreenScale && typeof camera !== 'undefined' && !humanControlMode) {
                    const pos = new THREE.Vector3();
                    object3D.getWorldPosition(pos);
                    const dist = pos.distanceTo(camera.position) || 1;
                    screenScale = collisionScreenRefDistance / Math.max(dist, 1);
                }

                return [{
                    x: collisionFallbackCenter.x + (translation?.x ?? 0),
                    z: collisionFallbackCenter.z + (translation?.z ?? 0),
                    r: radius * screenScale
                }];
            }

            object3D.updateMatrixWorld(true);
            const worldScale = new THREE.Vector3();
            object3D.getWorldScale(worldScale);
            const radiusScale = (Math.abs(worldScale.x) + Math.abs(worldScale.z)) * 0.5;
            const translatedX = translation?.x ?? 0;
            const translatedZ = translation?.z ?? 0;

            // compute optional screen-scale based on camera distance
            let screenScale = 1;
            if (collisionUseScreenScale && typeof camera !== 'undefined' && !humanControlMode) {
                const pos = new THREE.Vector3();
                object3D.getWorldPosition(pos);
                const dist = pos.distanceTo(camera.position) || 1;
                screenScale = collisionScreenRefDistance / Math.max(dist, 1);
            }

            return collisionCircles.map(circle => {
                const localCenter = new THREE.Vector3(circle.x ?? 0, circle.y ?? 0, circle.z ?? 0);
                const worldCenter = localCenter.clone();
                object3D.localToWorld(worldCenter);

                return {
                    x: worldCenter.x + translatedX,
                    z: worldCenter.z + translatedZ,
                    r: (circle.r ?? 0) * radiusScale * screenScale
                };
            });
        }

        function objectsCollideByFootprint(objectA, objectB, translationA = null) {
            const circlesA = getWorldCollisionCircles(objectA, translationA);
            const circlesB = getWorldCollisionCircles(objectB);

            for (const circleA of circlesA) {
                for (const circleB of circlesB) {
                    const dx = circleA.x - circleB.x;
                    const dz = circleA.z - circleB.z;
                    const minDistance = circleA.r + circleB.r;

                    if ((dx * dx) + (dz * dz) <= minDistance * minDistance) {
                        return true;
                    }
                }
            }

            return false;
        }

        function toTransformData(object3D) {
            return {
                position: {
                    x: object3D.position.x,
                    y: object3D.position.y,
                    z: object3D.position.z
                },
                rotation: {
                    x: object3D.rotation.x,
                    y: object3D.rotation.y,
                    z: object3D.rotation.z
                },
                scale: {
                    x: object3D.scale.x,
                    y: object3D.scale.y,
                    z: object3D.scale.z
                }
            };
        }

        function removeGroupFromScene(groupArray) {
            for (const obj of groupArray) {
                scene.remove(obj);
            }
            groupArray.length = 0;
        }

        function clearScenarioObjects() {
            if (dinoData?.model) {
                scene.remove(dinoData.model);
                dinoData = null;
            }
            if (dino2Data?.model) {
                scene.remove(dino2Data.model);
                dino2Data = null;
            }
            removeGroupFromScene(trees);
            removeGroupFromScene(grasses);
            removeGroupFromScene(rocks);
            removeGroupFromScene(humans);
            removeGroupFromScene(cacts);
            setBushEffectEnabled(false);
            setTumbleweedEffectEnabled(false);

            if (window.clearPickedObject) window.clearPickedObject();

            try {
                localStorage.removeItem('tabletop_autosave');
            } catch (e) {}
        }

        function removeObjectFromArray(groupArray, object) {
            const idx = groupArray.indexOf(object);
            if (idx >= 0) {
                groupArray.splice(idx, 1);
                return true;
            }
            return false;
        }

        function removeScenarioObject(object) {
            if (!object || object === terrain) return false;

            let removed = false;
            if (dinoData?.model === object) {
                scene.remove(dinoData.model);
                dinoData = null;
                removed = true;
            } else if (dino2Data?.model === object) {
                scene.remove(dino2Data.model);
                dino2Data = null;
                removed = true;
            } else if (removeObjectFromArray(trees, object)) { scene.remove(object); removed = true; }
            else if (removeObjectFromArray(grasses, object)) { scene.remove(object); removed = true; }
            else if (removeObjectFromArray(bushes, object)) { scene.remove(object); removed = true; }
            else if (removeObjectFromArray(rocks, object)) { scene.remove(object); removed = true; }
            else if (removeObjectFromArray(tumbleweeds, object)) { scene.remove(object); removed = true; }
            else if (removeObjectFromArray(humans, object)) { scene.remove(object); removed = true; }
            else if (removeObjectFromArray(cacts, object)) { scene.remove(object); removed = true; }

            if (removed) {
                if (typeof autoSaveScenario === 'function') autoSaveScenario();
            }
            return removed;
        }

        function serializeScenario() {
            const objects = [];

            if (dinoData?.model) {
                objects.push({ type: 'dino', ...toTransformData(dinoData.model) });
            }
            if (dino2Data?.model) {
                objects.push({ type: 'dino2', ...toTransformData(dino2Data.model) });
            }

            trees.forEach(obj => objects.push({ type: 'tree', ...toTransformData(obj) }));
            grasses.forEach(obj => {
                if (!obj.userData?.isAmbientGrass) {
                    objects.push({ type: 'grass', ...toTransformData(obj) });
                }
            });
            rocks.forEach(obj => objects.push({
                type: 'rock',
                rockSize: obj.userData.rockSize || 'large',
                ...toTransformData(obj)
            }));
            humans.forEach(obj => objects.push({ type: 'human', ...toTransformData(obj) }));
            cacts.forEach(obj => objects.push({ type: 'cact', ...toTransformData(obj) }));

            return {
                version: SCENE_EXPORT_VERSION,
                terrainColor: `#${terrain.material.color.getHexString()}`,
                terrainTintColor,
                terrainTextureSlots: terrainTextureSlots.map(slot => ({ label: slot.label, url: slot.url })),
                terrainActiveTextureSlotIndex,
                bushEffectEnabled,
                grassEffectEnabled,
                tumbleweedEffectEnabled,
                objects
            };
        }

        function autoSaveScenario() {
            if (isInitializing || isLoadingScenario) return;
            try {
                const data = serializeScenario();
                localStorage.setItem('tabletop_autosave', JSON.stringify(data));
            } catch (e) {
                console.warn('Erro ao auto-guardar o cenário:', e);
            }
        }

        function isValidHexColor(value) {
            return typeof value === 'string' && /^#([0-9A-F]{3}|[0-9A-F]{6})$/i.test(value);
        }

        function loadScenario(data) {
            if (!data || !Array.isArray(data.objects)) {
                throw new Error('JSON inválido: falta o array "objects".');
            }

            isLoadingScenario = true;
            try {
                clearScenarioObjects();
                let hasLegacyBushes = false;
                let hasLegacyTumbleweeds = false;

                if (Array.isArray(data.terrainTextureSlots)) {
                    data.terrainTextureSlots.slice(0, terrainTextureSlots.length).forEach((slot, index) => {
                        if (slot && typeof slot.url === 'string') {
                            terrainTextureSlots[index].url = slot.url;
                        }
                    });
                }

                if (isValidHexColor(data.terrainTintColor)) {
                    applyTerrainTintColor(data.terrainTintColor);
                } else if (isValidHexColor(data.terrainColor)) {
                    applyTerrainTintColor(data.terrainColor);
                } else {
                    applyTerrainTintColor('#ffffff');
                }

                refreshTerrainTextureSlotUI();

                if (typeof data.terrainActiveTextureSlotIndex === 'number') {
                    applyTerrainTextureSlot(THREE.MathUtils.clamp(data.terrainActiveTextureSlotIndex, 0, terrainTextureSlots.length - 1));
                } else if (typeof data.terrainTextureType === 'string') {
                    window.setTerrainTexture(data.terrainTextureType);
                } else {
                    applyTerrainTextureSlot(0);
                }

                for (const entry of data.objects) {
                    if (!entry?.type) continue;

                    switch (entry.type) {
                        case 'dino':
                            window.addDino({ transform: entry, silent: true });
                            break;
                        case 'dino2':
                            window.addDino2({ transform: entry, silent: true });
                            break;
                        case 'tree':
                            window.addTree(entry);
                            break;
                        case 'grass':
                            window.addGrass(entry);
                            break;
                        case 'bush':
                            hasLegacyBushes = true;
                            break;
                        case 'rock':
                            window.addRock(entry.rockSize || 'large', entry);
                            break;
                        case 'tumbleweed':
                            hasLegacyTumbleweeds = true;
                            break;
                        case 'cact':
                            window.addCact(entry);
                            break;
                        case 'human':
                            window.addHuman(entry);
                            break;
                        default:
                            console.warn('Tipo de objeto não suportado no JSON:', entry.type);
                    }
                }

                if (typeof data.bushEffectEnabled === 'boolean') {
                    setBushEffectEnabled(data.bushEffectEnabled);
                } else {
                    setBushEffectEnabled(hasLegacyBushes);
                }

                if (typeof data.grassEffectEnabled === 'boolean') {
                    setGrassEffectEnabled(data.grassEffectEnabled);
                }

                if (typeof data.tumbleweedEffectEnabled === 'boolean') {
                    setTumbleweedEffectEnabled(data.tumbleweedEffectEnabled);
                } else {
                    setTumbleweedEffectEnabled(hasLegacyTumbleweeds);
                }
            } finally {
                isLoadingScenario = false;
            }

            if (typeof autoSaveScenario === 'function') autoSaveScenario();
        }

        window.toggleRockAccordion = function (header) {
            const body = document.getElementById('rockAccordion');
            const chevron = header.querySelector('.accordion-chevron');
            body.classList.toggle('open');
            chevron.classList.toggle('open');
        };

        window.addRock = function (size, transform = null) {
            const rock = createRock(size);
            if (transform) {
                applyTransform(rock, transform);
            } else {
                rock.position.set(Math.random() * 100 - 50, -1, Math.random() * 100 - 50);
            }
            rock.userData.rockSize = size;
            applyShadowSettings(rock);
            scene.add(rock);
            if (!transform) {
                snapObjectToTerrain(rock);
            }
            rocks.push(rock);
            console.log('Pedra ' + size + ' adicionada!');
            if (typeof autoSaveScenario === 'function') autoSaveScenario();
            return rock;
        };

        window.addDino = function (options = {}) {
            const { transform = null, silent = false } = options;
            if (!dinoData) {
                dinoData = createDino();
                if (transform) {
                    applyTransform(dinoData.model, transform);
                } else {
                    dinoData.model.position.y = 0;
                }
                applyShadowSettings(dinoData.model);
                scene.add(dinoData.model);
                if (!transform) {
                    snapObjectToTerrain(dinoData.model);
                }
                console.log("Dino adicionado!");
                if (typeof autoSaveScenario === 'function') autoSaveScenario();
                return dinoData.model;
            } else {
                if (!silent) {
                    alert("O dinossauro já está na cena!");
                }
                return dinoData.model;
            }
        };

        window.addDino2 = function (options = {}) {
            const { transform = null, silent = false } = options;
            if (!dino2Data) {
                dino2Data = createDino2();
                if (transform) {
                    applyTransform(dino2Data.model, transform);
                } else {
                    dino2Data.model.position.y = 0;
                }
                applyShadowSettings(dino2Data.model);
                scene.add(dino2Data.model);
                if (!transform) {
                    snapObjectToTerrain(dino2Data.model);
                }
                console.log("Ankylosaurus adicionado!");
                if (typeof autoSaveScenario === 'function') autoSaveScenario();
                return dino2Data.model;
            } else {
                if (!silent) {
                    alert("O Ankylosaurus já está na cena!");
                }
                return dino2Data.model;
            }
        };

        window.addTree = function (transform = null) {
            const newTree = createTree();
            if (transform) {
                applyTransform(newTree, transform);
            } else {
                newTree.position.set(Math.random() * 100 - 50, 0, Math.random() * 100 - 50);
            }
            applyShadowSettings(newTree);
            scene.add(newTree);
            if (!transform) {
                snapObjectToTerrain(newTree);
            }
            trees.push(newTree);
            console.log("Árvore adicionada!");
            if (typeof autoSaveScenario === 'function') autoSaveScenario();
            return newTree;
        };

        window.addGrass = function (transform = null) {
            const newGrass = createForestGrass();
            if (transform) {
                applyTransform(newGrass, transform);
            } else {
                newGrass.position.set(Math.random() * 100 - 50, 0, Math.random() * 100 - 50);
            }
            applyShadowSettings(newGrass);
            scene.add(newGrass);
            if (!transform) {
                snapObjectToTerrain(newGrass);
            }
            grasses.push(newGrass);
            console.log("Ervinhas adicionadas!");
            if (typeof autoSaveScenario === 'function') autoSaveScenario();
            return newGrass;
        };

        window.addHuman = function (transform = null) {
            const newHuman = createHuman();
            if (transform) {
                applyTransform(newHuman, transform);
            } else {
                newHuman.position.set(Math.random() * 100 - 50, 0, Math.random() * 100 - 50);
            }
            applyShadowSettings(newHuman);
            scene.add(newHuman);
            if (!transform) {
                snapObjectToTerrain(newHuman);
            }
            humans.push(newHuman);
            console.log("Ser humano adicionado!");
            if (typeof autoSaveScenario === 'function') autoSaveScenario();
            return newHuman;
        };

        window.addCact = function (transform = null) {
            const newCact = createCact();
            if (transform) {
                applyTransform(newCact, transform);
            } else {
                newCact.position.set(Math.random() * 100 - 50, 0, Math.random() * 100 - 50);
            }
            applyShadowSettings(newCact);
            scene.add(newCact);
            if (!transform) {
                snapObjectToTerrain(newCact);
            }
            cacts.push(newCact);
            console.log("Cacto adicionado!");
            if (typeof autoSaveScenario === 'function') autoSaveScenario();
            return newCact;
        };

        function init() {
            const container = document.getElementById('viewport');
            scene = new THREE.Scene();
            window.scene = scene;
            scene.background = new THREE.Color(0x3e7ab6);

            terrain = createTerrain();
            terrain.position.y = 0;
            terrain.receiveShadow = true;
            scene.add(terrain);
            terrainTextureCards[0] = document.getElementById('terrainTextureSlot0Card');
            terrainTextureCards[1] = document.getElementById('terrainTextureSlot1Card');
            terrainTextureCards[2] = document.getElementById('terrainTextureSlot2Card');
            terrainTextureCards[3] = document.getElementById('terrainTextureSlot3Card');
            terrainTextureButtons[0] = document.getElementById('terrainTextureSlot0Button');
            terrainTextureButtons[1] = document.getElementById('terrainTextureSlot1Button');
            terrainTextureButtons[2] = document.getElementById('terrainTextureSlot2Button');
            terrainTextureButtons[3] = document.getElementById('terrainTextureSlot3Button');
            const terrainTintInput = document.getElementById('terrainTintColor');
            if (terrainTintInput) {
                terrainTintInput.addEventListener('input', (event) => {
                    applyTerrainTintColor(event.target.value);
                });
                terrainTintInput.addEventListener('change', () => {
                    if (typeof autoSaveScenario === 'function') autoSaveScenario();
                });
            }

            applyTerrainTintColor('#ffffff');
            refreshTerrainTextureSlotUI();
            applyTerrainTextureSlot(0);

            // --- CAMERA ---
            const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 5000);
            camera.position.set(420, 260, 420);
            camera.lookAt(0, 40, 0);
            camera.updateProjectionMatrix();

            scene.add(camera);

            // --- LIGHTING ---
            // Sol: DirectionalLight simula raios paralelos vindos de longe
            const sunLight = new THREE.DirectionalLight(0xfff4e0, 2.5);
            const sunLightOffset = new THREE.Vector3(600, 800, 400);
            const shadowFocusPoint = new THREE.Vector3(0, 0, 0);
            const shadowFrustumHalfSize = 550;

            sunLight.position.copy(sunLightOffset);
            sunLight.target.position.set(0, 0, 0);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 4096;
            sunLight.shadow.mapSize.height = 4096;
            sunLight.shadow.camera.near = 40;
            sunLight.shadow.camera.far = 2600;
            // Frustum suficientemente grande para não cortar, mas ainda com bom detalhe.
            sunLight.shadow.camera.left = -shadowFrustumHalfSize;
            sunLight.shadow.camera.right = shadowFrustumHalfSize;
            sunLight.shadow.camera.top = shadowFrustumHalfSize;
            sunLight.shadow.camera.bottom = -shadowFrustumHalfSize;
            // Bias afinado para reduzir acne sem criar efeito de flutuação de sombra.
            sunLight.shadow.bias = -0.00003;
            sunLight.shadow.normalBias = 0.008;
            sunLight.shadow.radius = 2;
            scene.add(sunLight);
            scene.add(sunLight.target);

            // Luz ambiente suave para que as zonas de sombra não fiquem completamente escuras
            const ambientLight = new THREE.AmbientLight(0x88aacc, 0.8);
            scene.add(ambientLight);

            // --- RENDERER ---
            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.domElement.tabIndex = 0;
            renderer.domElement.style.outline = 'none'; // remove o anel de foco visual
            container.appendChild(renderer.domElement);

            // --- VARIÁVEIS DE CONTROLO ---
            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();
            const sidebar = document.getElementById('sidebar');
            const humanControlButton = document.getElementById('humanControlButton');
            let selectedObject = null;
            let lastPickedObject = null;
            let selectionBox = null;
            let selectionOutline = null;

            const humanMoveState = {
                forward: false,
                backward: false,
                left: false,
                right: false,
            };

            const humanControlSettings = {
                speed: 250,        // terreno 3000x3000 — velocidade proporcional
                jumpSpeed: 400,
                gravity: 700,
                mouseSensitivity: 0.0022,
                maxPitch: Math.PI / 2 - 0.1,
                cameraForwardOffset: 4.5,
            };

            const humanGroundRay = new THREE.Raycaster();
            const humanForward = new THREE.Vector3();
            const humanRight = new THREE.Vector3();
            const humanMoveVector = new THREE.Vector3();
            const humanEyePosition = new THREE.Vector3();
            const humanLookDirection = new THREE.Vector3();
            const humanLookTarget = new THREE.Vector3();
            const cameraDirection = new THREE.Vector3();

            // Plano horizontal usado durante o drag (actualizado para a altura do objecto)
            const dragPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
            const intersectionPoint = new THREE.Vector3();

            // Helper: calcula coordenadas NDC correctas relativas ao canvas do renderer
            function getMouseNDC(event) {
                const rect = renderer.domElement.getBoundingClientRect();
                mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
            }

            const deleteModeButton = document.getElementById('deleteModeButton');
            bushToggleButton = document.getElementById('bushToggleButton');
            grassToggleButton = document.getElementById('grassToggleButton');
            tumbleweedToggleButton = document.getElementById('tumbleweedToggleButton');

            // --- LÓGICA DO MENU DE CONTEXTO FLUTUANTE ---
            const contextMenu = document.getElementById('contextMenu');
            const contextTitle = document.getElementById('contextTitle');
            const ctxScaleSlider = document.getElementById('ctxScaleSlider');
            const ctxRotationSlider = document.getElementById('ctxRotationSlider');
            const ctxScaleValue = document.getElementById('ctxScaleValue');
            const ctxRotationValue = document.getElementById('ctxRotationValue');
            const ctxCloseBtn = document.getElementById('ctxCloseBtn');
            let contextTargetObject = null;

            function syncContextRotationControls(object) {
                if (contextTargetObject !== object || contextMenu.style.display !== 'block') return;

                let currentRotDeg = THREE.MathUtils.radToDeg(object.rotation.y) % 360;
                if (currentRotDeg < 0) currentRotDeg += 360;
                ctxRotationSlider.value = currentRotDeg;
                ctxRotationValue.textContent = Math.round(currentRotDeg);
            }

            function scaleObjectPreservingBottom(object3D, applyScale, options = {}) {
                if (!object3D || typeof applyScale !== 'function') return;

                const currentBottomY = getObjectBottomY(object3D);
                applyScale(object3D);

                if (currentBottomY !== null) {
                    alignObjectBottomToWorldY(object3D, currentBottomY);
                }

                if (options.updateDragPlane) {
                    dragPlane.constant = -object3D.position.y;
                }
            }

            window.clearPickedObject = () => {
                lastPickedObject = null;
                contextTargetObject = null;
                if (contextMenu) contextMenu.style.display = 'none';
            };

            // Detetar o Botão Direito do Rato (contextmenu)
            renderer.domElement.addEventListener('contextmenu', (event) => {
                event.preventDefault(); // Impede o menu do browser de aparecer
            });

            ctxScaleSlider.addEventListener('input', (e) => {
                if (!contextTargetObject) return;
                const val = parseFloat(e.target.value);
                const isScalingDraggedObject = isDragging && selectedObject === contextTargetObject;
                scaleObjectPreservingBottom(contextTargetObject, (object3D) => {
                    object3D.scale.set(val, val, val);
                }, {
                    updateDragPlane: isScalingDraggedObject
                });
                if (!isScalingDraggedObject) {
                    snapObjectToTerrain(contextTargetObject);
                }
                ctxScaleValue.textContent = val.toFixed(1);
            });

            ctxRotationSlider.addEventListener('input', (e) => {
                if (!contextTargetObject) return;
                const val = parseFloat(e.target.value);
                contextTargetObject.rotation.y = THREE.MathUtils.degToRad(val);
                ctxRotationValue.textContent = Math.round(val);
            });

            ctxScaleSlider.addEventListener('change', () => {
                if (typeof autoSaveScenario === 'function') autoSaveScenario();
            });

            ctxRotationSlider.addEventListener('change', () => {
                if (typeof autoSaveScenario === 'function') autoSaveScenario();
            });

            ctxCloseBtn.addEventListener('click', () => {
                contextMenu.style.display = 'none';
                contextTargetObject = null;
            });

            function updateDeleteModeButton() {
                deleteModeButton.textContent = `Modo Apagar: ${deleteMode ? 'ON' : 'OFF'}`;
                deleteModeButton.classList.toggle('active', deleteMode);
            }

            deleteModeButton.addEventListener('click', () => {
                deleteMode = !deleteMode;
                updateDeleteModeButton();
            });

            bushToggleButton.addEventListener('click', () => {
                setBushEffectEnabled(!bushEffectEnabled);
            });

            grassToggleButton.addEventListener('click', () => {
                setGrassEffectEnabled(!grassEffectEnabled);
            });

            tumbleweedToggleButton.addEventListener('click', () => {
                setTumbleweedEffectEnabled(!tumbleweedEffectEnabled);
            });

            updateDeleteModeButton();
            updateBushToggleButton();
            updateGrassToggleButton();
            updateTumbleweedToggleButton();

            // Botão de limpar cenário
            const clearSceneButton = document.getElementById('clearSceneButton');
            if (clearSceneButton) {
                clearSceneButton.addEventListener('click', () => {
                    if (confirm('Tem certeza que deseja limpar todo o cenário?')) {
                        clearScenarioObjects();
                    }
                });
            }

            function resizeViewport() {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            }

            function scheduleViewportResize() {
                requestAnimationFrame(() => {
                    requestAnimationFrame(() => {
                        resizeViewport();
                    });
                });
            }

            function setHumanControlButtonLabel() {
                humanControlButton.textContent = humanControlMode
                    ? 'Sair do Humano (Esc / F)'
                    : 'Entrar no Humano (F)';
            }

            function getSceneRootObject(object) {
                let root = object;
                while (root.parent && root.parent !== scene) {
                    root = root.parent;
                }
                return root;
            }

            function getInteractiveObjectFromIntersections(intersections) {
                for (const hit of intersections) {
                    const rootObject = getSceneRootObject(hit.object);
                    if (rootObject === terrain) continue;
                    if (rootObject.userData?.draggable === false) continue;
                    if (rootObject.userData?.ignoreSceneTools) continue;
                    return rootObject;
                }
                return null;
            }

            function resetHumanMoveState() {
                humanMoveState.forward = false;
                humanMoveState.backward = false;
                humanMoveState.left = false;
                humanMoveState.right = false;
            }

            function getHumanForControl() {
                if (lastPickedObject && lastPickedObject.name === 'Human') {
                    return lastPickedObject;
                }
                if (humans.length > 0) {
                    return humans[humans.length - 1];
                }
                return null;
            }

            function enterHumanControlMode(targetHuman = null) {
                const human = targetHuman || getHumanForControl();
                if (!human) {
                    alert('Adiciona e seleciona um ser humano para entrar no modo de controlo.');
                    return;
                }

                console.log('Entrando no modo humano, humano:', human);
                controlledHuman = human;
                humanControlMode = true;
                deleteMode = false;
                updateDeleteModeButton();

                if (isDragging) {
                    isDragging = false;
                    selectedObject = null;
                }

                window.clearPickedObject();

                controls.enabled = false;
                movementSpeed = 1.0;
                snapObjectToTerrain(controlledHuman);

                camera.getWorldDirection(cameraDirection);
                humanYaw = Math.atan2(cameraDirection.x, cameraDirection.z);
                humanPitch = THREE.MathUtils.clamp(
                    Math.asin(THREE.MathUtils.clamp(cameraDirection.y, -0.95, 0.95)),
                    -humanControlSettings.maxPitch,
                    humanControlSettings.maxPitch
                );

                humanForward.set(Math.sin(humanYaw), 0, Math.cos(humanYaw));
                getHumanCameraEyeWorldPosition(controlledHuman, humanEyePosition);

                // Aumentar o offset para frente para evitar clipping dentro do modelo
                const initialOffset = getHumanCameraForwardOffset(controlledHuman) + 1.0;
                camera.position.copy(humanEyePosition).addScaledVector(
                    humanForward,
                    initialOffset
                );

                // Apontar a câmera para a direção correta
                humanLookDirection.set(
                    Math.sin(humanYaw) * Math.cos(humanPitch),
                    Math.sin(humanPitch),
                    Math.cos(humanYaw) * Math.cos(humanPitch)
                );
                humanLookTarget.copy(camera.position).add(humanLookDirection);
                camera.lookAt(humanLookTarget);

                humanVerticalVelocity = 0;
                humanCanJump = true;
                sidebar.classList.add('hidden');
                setHumanControlButtonLabel();
                scheduleViewportResize();

                // Retirar foco de qualquer elemento HTML (ex: botão que foi clicado)
                // para garantir que os eventos de teclado chegam ao listener do window.
                if (document.activeElement && document.activeElement !== document.body) {
                    document.activeElement.blur();
                }
                renderer.domElement.focus();

                if (renderer.domElement.requestPointerLock) {
                    renderer.domElement.requestPointerLock();
                }
            }

            function exitHumanControlMode() {
                if (!humanControlMode) return;

                console.log('Saindo do modo humano');
                humanControlMode = false;
                resetHumanMoveState();
                humanVerticalVelocity = 0;
                humanCanJump = false;

                if (document.pointerLockElement === renderer.domElement && document.exitPointerLock) {
                    document.exitPointerLock();
                }

                sidebar.classList.remove('hidden');
                setHumanControlButtonLabel();
                scheduleViewportResize();

                if (controlledHuman) {
                    controls.target.copy(controlledHuman.position);
                    camera.position.set(
                        controlledHuman.position.x + 90,
                        controlledHuman.position.y + 60,
                        controlledHuman.position.z + 90
                    );
                }

                controls.enabled = true;
                controls.update();
                updateSunShadowFocus();
                controlledHuman = null;
            }

            function updateHumanControl(deltaTime) {
                if (!humanControlMode || !controlledHuman) {
                    return;
                }

                if (deltaTime === undefined || deltaTime === null) {
                    console.warn('deltaTime undefined!');
                    return;
                }

                humanForward.set(Math.sin(humanYaw), 0, Math.cos(humanYaw));
                humanRight.set(humanForward.z, 0, -humanForward.x);

                humanMoveVector.set(0, 0, 0);
                if (humanMoveState.forward) humanMoveVector.add(humanForward);
                if (humanMoveState.backward) humanMoveVector.sub(humanForward);
                if (humanMoveState.left) humanMoveVector.add(humanRight);
                if (humanMoveState.right) humanMoveVector.sub(humanRight);


                // Colisão com objetos (exceto grass, bush e tumbleweed)
                if (humanMoveVector.lengthSq() > 0) {
                    humanMoveVector.normalize().multiplyScalar(humanControlSettings.speed * deltaTime);
                    let collision = false;
                    // Checar colisão com árvores, pedras, cactos, humanos, dino
                    const checkGroups = [trees, rocks, cacts, humans];
                    if (dinoData?.model) checkGroups.push([dinoData.model]);
                    if (dino2Data?.model) checkGroups.push([dino2Data.model]);
                    for (const group of checkGroups) {
                        for (const obj of group) {
                            if (obj === controlledHuman) continue;
                            if (!obj || obj.name === 'Grass' || obj.name === 'Bush' || obj.name === 'Tumbleweed') continue;

                            // Só bloqueia se o humano NÃO está já a colidir com esse objecto.
                            // Isto evita que ele fique preso num objecto grande onde começou (como o dino).
                            const alreadyInside = objectsCollideByFootprint(controlledHuman, obj);
                            if (!alreadyInside && objectsCollideByFootprint(controlledHuman, obj, humanMoveVector)) {
                                collision = true;
                                break;
                            }
                        }
                        if (collision) break;
                    }
                    if (!collision) {
                        controlledHuman.position.add(humanMoveVector);
                        controlledHuman.rotation.y = Math.atan2(humanForward.x, humanForward.z);
                    }
                }

                humanVerticalVelocity -= humanControlSettings.gravity * deltaTime;
                controlledHuman.position.y += humanVerticalVelocity * deltaTime;

                humanGroundRay.set(
                    new THREE.Vector3(controlledHuman.position.x, 500, controlledHuman.position.z),
                    new THREE.Vector3(0, -1, 0)
                );
                const groundHit = humanGroundRay.intersectObject(terrain);
                if (groundHit.length > 0) {
                    const groundY = groundHit[0].point.y + getPlacementClearance(controlledHuman);
