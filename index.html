<!DOCTYPE html>
<html lang="en">

<head>
    <title>3D Tabletop Editor</title>
    <meta charset="utf-8">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
            background: #1b2632;
        }

        /* Barra Lateral */
        #sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 280px;
            height: 100vh;
            background: #2c3e50;
            color: white;
            padding: 20px;
            box-sizing: border-box;
            z-index: 10;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            overflow-x: hidden;
            transition: transform 0.25s ease;
            will-change: transform;
        }

        #sidebar.hidden {
            transform: translateX(-100%);
            pointer-events: none;
        }

        #sidebar::-webkit-scrollbar-track {
            background: #34495e;
        }

        #sidebar::-webkit-scrollbar-thumb {
            background: #7f8c8d;
            border-radius: 4px;
        }

        #sidebar::-webkit-scrollbar-thumb:hover {
            background: #95a5a6;
        }

        #viewport {
            position: absolute;
            inset: 0;
        }

        .menu-section {
            border-bottom: 1px solid #555;
            padding-bottom: 15px;
        }

        h3 {
            margin-top: 0;
            color: #ecf0f1;
            font-size: 18px;
        }

        .model-item {
            background: hsl(210, 49%, 48%);
            padding: 10px;
            margin: 5px 0;
            cursor: pointer;
            border-radius: 4px;
            text-align: center;
            transition: background 0.2s;
        }

        .model-item:hover {
            background: #45a049;
        }

        input[type="color"] {
            width: 100%;
            height: 40px;
            cursor: pointer;
            border: none;
        }

        .terrain-tone-control {
            margin-top: 10px;
        }

        .terrain-tone-control label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: #ecf0f1;
        }

        .texture-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
        }

        .texture-slot {
            position: relative;
            aspect-ratio: 1 / 1;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            overflow: hidden;
            background: #243446;
            box-shadow: inset 0 -50px 40px rgba(0, 0, 0, 0.25);
        }

        .texture-slot-main {
            position: absolute;
            inset: 0;
            border: 0;
            background-size: cover;
            background-position: center;
            color: #fff;
            font-weight: 700;
            text-shadow: 0 2px 6px rgba(0, 0, 0, 0.85);
            cursor: pointer;
            display: flex;
            align-items: flex-end;
            justify-content: flex-start;
            padding: 10px;
        }

        .texture-slot-main::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0.08));
        }

        .texture-slot-main span {
            position: relative;
            z-index: 1;
        }

        .texture-slot.active {
            outline: 2px solid #f1c40f;
            box-shadow: 0 0 0 2px rgba(241, 196, 15, 0.35), inset 0 -50px 40px rgba(0, 0, 0, 0.25);
        }

        .texture-slot-empty {
            background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.08) 50%, rgba(255, 255, 255, 0.08) 75%, transparent 75%, transparent);
            background-size: 18px 18px;
        }

        .texture-slot-edit {
            position: absolute;
            right: 8px;
            top: 8px;
            z-index: 2;
            border: none;
            border-radius: 999px;
            padding: 6px 9px;
            background: rgba(0, 0, 0, 0.6);
            color: #fff;
            cursor: pointer;
            font-size: 11px;
        }

        .texture-slot-edit:hover {
            background: rgba(0, 0, 0, 0.78);
        }

        .action-button {
            padding: 10px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 8px;
        }

        .action-button.secondary {
            background: #2980b9;
        }

        .action-button.tertiary {
            background: #16a085;
        }

        .action-button.danger {
            background: #c0392b;
        }

        .action-button.active {
            outline: 2px solid #f1c40f;
            box-shadow: 0 0 0 2px rgba(241, 196, 15, 0.35);
        }

        /* Barra Lateral Modernizada - Estilos dos Botões */
        .no-border {
            border-bottom: none !important;
        }

        /* Grelha para Vegetação (Pills) */
        .effects-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 8px;
        }

        .pill-button {
            background: #34495e;
            color: #bdc3c7;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            padding: 8px 4px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: all 0.2s ease;
            font-size: 11px;
        }

        .pill-button:hover {
            background: #3d566e;
            color: #ffffff;
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-1px);
        }

        .pill-button.active {
            background: #16a085;
            color: #ffffff;
            border-color: #1abc9c;
            box-shadow: 0 0 8px rgba(22, 160, 133, 0.4);
        }

        /* Grelha para Ferramentas */
        .tools-grid {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .tool-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
            position: relative;
        }

        .tool-button.primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            box-shadow: 0 4px 6px rgba(52, 152, 219, 0.2);
        }

        .tool-button.primary:hover {
            background: linear-gradient(135deg, #4fa7e8, #3498db);
            transform: translateY(-1px);
            box-shadow: 0 6px 12px rgba(52, 152, 219, 0.3);
        }

        .tool-button.danger {
            background: #34495e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #e74c3c;
        }

        .tool-button.danger:hover {
            background: #3d566e;
            color: #ff6b6b;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .tool-button.danger.active {
            background: linear-gradient(135deg, #e74c3c, #c0392b);
            border: none;
            color: white;
            box-shadow: 0 4px 6px rgba(231, 76, 60, 0.2);
        }

        .tool-button.danger.active:hover {
            background: linear-gradient(135deg, #ff6b6b, #e74c3c);
            transform: translateY(-1px);
            box-shadow: 0 6px 12px rgba(231, 76, 60, 0.3);
        }

        .tool-button.secondary {
            background: #34495e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #bdc3c7;
        }

        .tool-button.secondary:hover {
            background: #3d566e;
            color: white;
            border-color: rgba(255, 255, 255, 0.2);
        }

        .tool-button.secondary.active {
            background: linear-gradient(135deg, #16a085, #1abc9c);
            border: none;
            color: white;
            box-shadow: 0 4px 6px rgba(22, 160, 133, 0.2);
        }

        .tool-button.secondary.active:hover {
            background: linear-gradient(135deg, #1abc9c, #16a085);
            transform: translateY(-1px);
            box-shadow: 0 6px 12px rgba(22, 160, 133, 0.3);
        }

        .tool-button .badge {
            background: rgba(255, 255, 255, 0.25);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            position: absolute;
            right: 12px;
        }

        /* Gestão de Cenário */
        .scenario-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-top: 8px;
        }

        .scenario-btn {
            padding: 10px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: all 0.2s ease;
            color: white;
            text-align: center;
        }

        .scenario-btn.secondary {
            background: #34495e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #3498db;
        }

        .scenario-btn.secondary:hover {
            background: #2c3e50;
            color: #4fa7e8;
            border-color: rgba(52, 152, 219, 0.5);
            transform: translateY(-1px);
        }

        .scenario-btn.tertiary {
            background: #34495e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #1abc9c;
        }

        .scenario-btn.tertiary:hover {
            background: #2c3e50;
            color: #1abc9c;
            border-color: rgba(26, 188, 156, 0.5);
            transform: translateY(-1px);
        }

        .scenario-btn.history {
            background: #34495e;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f1c40f;
        }

        .scenario-btn.history:hover:not(:disabled) {
            background: #2c3e50;
            color: #f39c12;
            border-color: rgba(241, 196, 15, 0.5);
            transform: translateY(-1px);
        }

        .clear-btn {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            background: rgba(192, 57, 43, 0.15);
            color: #e74c3c;
            border: 1px dashed #e74c3c;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s ease;
        }

        .clear-btn:hover {
            background: #c0392b;
            color: white;
            border-style: solid;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(192, 57, 43, 0.2);
        }

        /* Controles de Terreno */
        .terrain-control {
            margin-bottom: 12px;
        }

        .terrain-control label {
            display: block;
            font-size: 12px;
            margin-bottom: 4px;
            color: #ecf0f1;
        }

        /* Acordeão de pedras */
        .menu-section .model-item {
            font-size: 14px;
            padding: 12px;
        }

        .accordion-header {
            background: hsl(210, 49%, 48%);
            padding: 10px;
            margin: 5px 0;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
            user-select: none;
        }

        .accordion-header:hover {
            background: #45a049;
        }

        .accordion-chevron {
            font-size: 11px;
            transition: transform 0.2s;
        }

        .accordion-chevron.open {
            transform: rotate(90deg);
        }

        .accordion-body {
            display: none;
            padding-left: 8px;
        }

        .accordion-body.open {
            display: block;
        }

        .accordion-body .model-item {
            font-size: 13px;
        }

        /* === DIA/NOITE === */
        .day-night-section {
            border-bottom: 1px solid #555;
            padding-bottom: 15px;
        }

        .time-display {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
        }

        .time-display span {
            font-size: 13px;
            color: #ecf0f1;
        }

        #timeClock {
            font-size: 18px;
            font-weight: bold;
            color: #f1c40f;
            font-family: monospace;
        }

        #timeSlider {
            width: 100%;
            accent-color: #f1c40f;
            cursor: pointer;
        }

        .sun-icon {
            font-size: 20px;
            transition: transform 0.3s;
        }
    </style>
</head>

<body>
    <div id="sidebar">
        <div class="menu-section">
            <h3>Cenário</h3>
            <label>Texturas do Terreno:</label>
            <div class="texture-grid">
                <div class="texture-slot active" id="terrainTextureSlot0Card">
                    <button type="button" class="texture-slot-main" id="terrainTextureSlot0Button"
                        onclick="setTerrainTextureSlot(0)">
                        <span>Textura 1</span>
                    </button>
                    <button type="button" class="texture-slot-edit" onclick="editTerrainTextureSlot(0)">Editar
                        URL</button>
                </div>
                <div class="texture-slot" id="terrainTextureSlot1Card">
                    <button type="button" class="texture-slot-main" id="terrainTextureSlot1Button"
                        onclick="setTerrainTextureSlot(1)">
                        <span>Textura 2</span>
                    </button>
                    <button type="button" class="texture-slot-edit" onclick="editTerrainTextureSlot(1)">Editar
                        URL</button>
                </div>
                <div class="texture-slot" id="terrainTextureSlot2Card">
                    <button type="button" class="texture-slot-main texture-slot-empty" id="terrainTextureSlot2Button"
                        onclick="setTerrainTextureSlot(2)">
                        <span>Textura 3</span>
                    </button>
                    <button type="button" class="texture-slot-edit" onclick="editTerrainTextureSlot(2)">Editar
                        URL</button>
                </div>
                <div class="texture-slot" id="terrainTextureSlot3Card">
                    <button type="button" class="texture-slot-main texture-slot-empty" id="terrainTextureSlot3Button"
                        onclick="setTerrainTextureSlot(3)">
                        <span>Textura 4</span>
                    </button>
                    <button type="button" class="texture-slot-edit" onclick="editTerrainTextureSlot(3)">Editar
                        URL</button>
                </div>
            </div>
            <div class="terrain-tone-control">
                <label for="terrainTintColor">Tom do Terreno:</label>
                <input type="color" id="terrainTintColor" value="#ffffff">
            </div>
        </div>

        <div class="menu-section">
            <h3>Modelos</h3>
            <div class="model-item" onclick="addDino()">Dinossauro T-Rex</div>
            <div class="model-item" onclick="addDino2()">Dinossauro Ankylosaurus</div>
            <div class="model-item" onclick="addTree()">Árvore</div>
            <!-- <div class="model-item" onclick="addGrass()">Ervinhas</div> -->
            <div class="model-item" onclick="addHuman()">Ser Humano</div>
            <div class="model-item" onclick="addCact()">Cacto</div>
            <div class="model-item" onclick="addPond()">Charco</div>
            <div class="model-item" onclick="addIceSpike()">Espigão de Gelo</div>

            <div class="accordion-header" onclick="toggleRockAccordion(this)">
                <span>Pedra</span>
                <span class="accordion-chevron">&#9654;</span>
            </div>
            <div class="accordion-body" id="rockAccordion">
                <div class="model-item" onclick="addRock('small')">Pedra Pequena</div>
                <div class="model-item" onclick="addRock('medium')">Pedra Média</div>
                <div class="model-item" onclick="addRock('large')">Pedra Grande</div>
            </div>
        </div>

        <!-- === CONTROLO DA HORA DO DIA === -->
        <div class="menu-section day-night-section">
            <h3>&#9728; Hora do Dia</h3>
            <div class="time-display">
                <span class="sun-icon" id="sunIcon">&#9728;</span>
                <span id="timeClock">12:00</span>
                <span class="sun-icon" id="moonIcon">&#9790;</span>
            </div>
            <input type="range" id="timeSlider" min="0" max="1440" step="1" value="720">
            <button id="timeAutoButton" class="action-button tertiary" style="margin-top:8px;width:100%;">Ciclo Auto:
                OFF</button>
        </div>

        <!-- === VEGETAÇÃO E EFEITOS === -->
        <div class="menu-section">
            <h3>&#127806; Vegetação & Efeitos</h3>
            <div class="effects-grid">
                <button id="bushToggleButton" class="pill-button">
                    <span class="btn-icon">&#127809;</span>
                    <span class="btn-label">Arbustos</span>
                </button>
                <button id="grassToggleButton" class="pill-button">
                    <span class="btn-icon">&#127806;</span>
                    <span class="btn-label">Erva</span>
                </button>
                <button id="tumbleweedToggleButton" class="pill-button">
                    <span class="btn-icon">&#127810;</span>
                    <span class="btn-label">Mofo</span>
                </button>
            </div>
        </div>

        <!-- === MODOS & FERRAMENTAS === -->
        <div class="menu-section">
            <h3>&#128295; Modos & Ferramentas</h3>
            <div class="tools-grid">
                <button id="humanControlButton" class="tool-button primary">
                    <span class="btn-icon">&#128100;</span> Entrar no Humano <span class="badge">F</span>
                </button>
                <button id="deleteModeButton" class="tool-button danger">
                    <span class="btn-icon">&#128465;</span> Modo Apagar: OFF
                </button>
                <button id="btnToggleWireframe" class="tool-button secondary">
                    <span class="btn-icon">&#9635;</span> Modo Wireframe: OFF
                </button>
            </div>
        </div>

        <!-- === CONFIGURAÇÕES === -->
        <div class="menu-section">
            <div class="accordion-header" onclick="toggleConfigAccordion(this)" style="margin: 0; padding: 10px;">
                <span style="font-weight: bold; font-size: 13px; display: flex; align-items: center; gap: 8px; color: white;">
                    &#9881; Configurações
                </span>
                <span class="accordion-chevron">&#9654;</span>
            </div>
            <div class="accordion-body" id="configAccordion" style="margin-top: 10px;">
                <div class="config-control" style="margin-bottom: 12px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                        <label for="cfgSpeedSlider" style="font-size: 11px; color: #bdc3c7;">Velocidade:</label>
                        <span id="cfgSpeedValue" style="font-size: 11px; font-weight: bold; color: #1abc9c;">250</span>
                    </div>
                    <input type="range" id="cfgSpeedSlider" min="50" max="800" step="10" value="250" style="width: 100%; accent-color: #1abc9c; cursor: pointer;">
                </div>

                <div class="config-control" style="margin-bottom: 12px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                        <label for="cfgJumpSlider" style="font-size: 11px; color: #bdc3c7;">Força do Salto:</label>
                        <span id="cfgJumpValue" style="font-size: 11px; font-weight: bold; color: #1abc9c;">400</span>
                    </div>
                    <input type="range" id="cfgJumpSlider" min="100" max="1000" step="10" value="400" style="width: 100%; accent-color: #1abc9c; cursor: pointer;">
                </div>

                <div class="config-control" style="margin-bottom: 12px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                        <label for="cfgGravitySlider" style="font-size: 11px; color: #bdc3c7;">Gravidade:</label>
                        <span id="cfgGravityValue" style="font-size: 11px; font-weight: bold; color: #1abc9c;">700</span>
                    </div>
                    <input type="range" id="cfgGravitySlider" min="200" max="2000" step="50" value="700" style="width: 100%; accent-color: #1abc9c; cursor: pointer;">
                </div>

                <div class="config-control" style="margin-bottom: 12px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                        <label for="cfgSensitivitySlider" style="font-size: 11px; color: #bdc3c7;">Sensibilidade:</label>
                        <span id="cfgSensitivityValue" style="font-size: 11px; font-weight: bold; color: #1abc9c;">0.0022</span>
                    </div>
                    <input type="range" id="cfgSensitivitySlider" min="0.0005" max="0.0100" step="0.0005" value="0.0022" style="width: 100%; accent-color: #1abc9c; cursor: pointer;">
                </div>

                <div class="config-control" style="margin-bottom: 8px;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 4px;">
                        <label for="cfgTimeSpeedSlider" style="font-size: 11px; color: #bdc3c7;">Velocidade Tempo:</label>
                        <span id="cfgTimeSpeedValue" style="font-size: 11px; font-weight: bold; color: #1abc9c;">1.0x</span>
                    </div>
                    <input type="range" id="cfgTimeSpeedSlider" min="0.1" max="10" step="0.1" value="1" style="width: 100%; accent-color: #1abc9c; cursor: pointer;">
                </div>
            </div>
        </div>

        <!-- === GESTÃO DO CENÁRIO === -->
        <div class="menu-section no-border" style="border-bottom: none; padding-bottom: 0;">
            <h3>&#128190; Cenário</h3>
            <div class="history-actions" style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px;">
                <button id="undoButton" class="scenario-btn history" disabled>
                    &#8634; Desfazer
                </button>
                <button id="redoButton" class="scenario-btn history" disabled>
                    &#8635; Refazer
                </button>
            </div>
            <div class="scenario-actions">
                <button id="downloadSceneJsonButton" class="scenario-btn secondary">
                    &#128229; Exportar
                </button>
                <button id="loadSceneJsonButton" class="scenario-btn tertiary">
                    &#128228; Importar
                </button>
            </div>
            <button id="clearSceneButton" class="clear-btn">
                &#9888; Limpar Cenário
            </button>
        </div>
        <input type="file" id="sceneJsonFileInput" accept="application/json" style="display: none;">
    </div>


    <div id="viewport"></div>
    <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                 "three": "https://threejs.org/build/three.module.js",
                 "three/addons/": "https://threejs.org/examples/jsm/"
            }
        }
    </script>

    <script type="module">

        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Cache-busting dynamic imports for local modules to prevent browser caching issues in Live Server
        const v = Date.now();
        const { createDino } = await import(`./dino.js?v=${v}`);
        const { createDino2 } = await import(`./dino2.js?v=${v}`);
        const { createTerrain } = await import(`./terrain.js?v=${v}`);
        const { createTree } = await import(`./tree.js?v=${v}`);
        const { createForestGrass } = await import(`./grass.js?v=${v}`);
        const { createBush } = await import(`./bush.js?v=${v}`);
        const { createRock } = await import(`./lrock.js?v=${v}`);
        const { createTumbleweed } = await import(`./tumbleweed.js?v=${v}`);
        const { createHuman } = await import(`./human.js?v=${v}`);
        const { createCact } = await import(`./cact.js?v=${v}`);
        const { createPond } = await import(`./pond.js?v=${v}`);
        const { createIceSpike } = await import(`./icespike.js?v=${v}`);
        const { createSun } = await import(`./sun.js?v=${v}`);
        const { createMoon } = await import(`./moon.js?v=${v}`);

        let dinoData;
        let dino2Data;
        let isInitializing = true;
        let isLoadingScenario = false;
        let scene;

        function getTerrainBounds() {
            if (!terrain) return null;

            terrain.updateMatrixWorld(true);
            return new THREE.Box3().setFromObject(terrain);

        function getHaltonValue(index, base) {
            let result = 0;
            let factor = 1 / base;
            let current = index;

            while (current > 0) {
                result += factor * (current % base);
                current = Math.floor(current / base);
                factor /= base;
            }

            return result;
        }

        function jitterNormalized(value, amount) {
            return THREE.MathUtils.clamp(value + (Math.random() - 0.5) * amount, 0, 1);
        }

        function mapNormalizedToTerrainXZ(normalizedX, normalizedZ, inset = 0) {
            const bounds = getTerrainBounds();
            if (!bounds) return null;

            return new THREE.Vector2(
                THREE.MathUtils.lerp(bounds.min.x + inset, bounds.max.x - inset, normalizedX),
                THREE.MathUtils.lerp(bounds.min.z + inset, bounds.max.z - inset, normalizedZ)
            );
        }

        function clampPointToTerrainBounds(point, inset = 0) {
            const bounds = getTerrainBounds();
            if (!bounds) return point;

            point.x = THREE.MathUtils.clamp(point.x, bounds.min.x + inset, bounds.max.x - inset);
            point.y = THREE.MathUtils.clamp(point.y, bounds.min.z + inset, bounds.max.z - inset);
            return point;
        }

        function getTumbleweedFlow() {
            const bounds = getTerrainBounds();
            if (!bounds) return null;

            const width = bounds.max.x - bounds.min.x;
            const depth = bounds.max.z - bounds.min.z;
            const margin = Math.min(
                TUMBLEWEED_EFFECT_SETTINGS.cornerMargin,
                width * 0.12,
                depth * 0.12
            );
            const start = new THREE.Vector2(bounds.min.x + margin, bounds.min.z + margin);
            const end = new THREE.Vector2(bounds.max.x - margin, bounds.max.z - margin);
            const direction = end.clone().sub(start).normalize();
            const lateral = new THREE.Vector2(-direction.y, direction.x);

            return {
                bounds,
                start,
                direction,
                pathLength: start.distanceTo(end),
                lateralSpread: Math.min(width, depth) * TUMBLEWEED_EFFECT_SETTINGS.lateralSpreadFactor * 0.5,
                lateral,
            };
        }

        function randomTumbleweedSpawnInterval() {
            const { minSpawnInterval, maxSpawnInterval } = TUMBLEWEED_EFFECT_SETTINGS;
            return minSpawnInterval + Math.random() * (maxSpawnInterval - minSpawnInterval);

                texture.wrapS = THREE.RepeatWrapping;

                if (typeof renderer !== 'undefined' && renderer) {

                }
                terrainTextureCache.set(url, texture);
            }
            return texture;

        function getDistributedTumbleweedLateralBias(index, total) {
            if (total <= 1) return 0;

            const goldenRatioConjugate = 0.61803398875;
            const normalized = (index * goldenRatioConjugate) % 1;
            return normalized * 2 - 1;

        function spawnAmbientTumbleweed(options = {}) {
            const {
                progressRatio = 0,
                progressJitterRatio = 0,
                lateralBias = null,
                lateralJitter = 0,
            } = options;
            const flow = getTumbleweedFlow();
            if (!flow || !scene) return null;

            const tw = createTumbleweed();
            const normalizedProgress = THREE.MathUtils.clamp(
                progressRatio + (Math.random() - 0.5) * progressJitterRatio,
                0,
                1
            );
            const normalizedLateral = lateralBias === null
                ? (Math.random() * 2 - 1)
                : THREE.MathUtils.clamp(
                    lateralBias + (Math.random() - 0.5) * lateralJitter,
                    -1,
                    1
                );
            const lateralOffset = normalizedLateral * flow.lateralSpread;
            const pathJitter = (Math.random() - 0.5) * TUMBLEWEED_EFFECT_SETTINGS.pathDistanceJitter;
            const distanceAlongPath = THREE.MathUtils.clamp(
                flow.pathLength * normalizedProgress + pathJitter,
                0,
                flow.pathLength
            );
            const spawnPosition = flow.start.clone()
                .addScaledVector(flow.direction, distanceAlongPath)
                .addScaledVector(flow.lateral, lateralOffset);
            clampPointToTerrainBounds(spawnPosition, TUMBLEWEED_EFFECT_SETTINGS.spawnBoundsInset);

            const baseSpeed = 1.55 + Math.random() * 0.8;
            const sideDrift = (Math.random() - 0.5) * 0.08;
            const drift2D = flow.direction.clone().multiplyScalar(baseSpeed)
                .addScaledVector(flow.lateral, sideDrift);

            tw.position.set(spawnPosition.x, 0, spawnPosition.y);
            tw.userData.draggable = false;
            tw.userData.ignoreSceneTools = true;
            tw.userData.flowStart = flow.start.clone();
            tw.userData.flowDirection2D = flow.direction.clone();
            tw.userData.pathLength = flow.pathLength;
            tw.userData.despawnPadding = TUMBLEWEED_EFFECT_SETTINGS.despawnPadding;
            tw.userData.wind = drift2D;
            tw.userData.rollAxis = new THREE.Vector3(flow.direction.y, 0, -flow.direction.x)
                .add(new THREE.Vector3((Math.random() - 0.5) * 0.15, 0, (Math.random() - 0.5) * 0.15))
                .normalize();
            tw.userData.rollSpeed = 0.08 + Math.random() * 0.04;
            tw.userData.jumpHeight = 0;
            tw.userData.jumpVelocity = 0;
            tw.userData.nextJumpAt = Date.now() + 600 + Math.random() * 2200;

            disableShadows(tw);
            scene.add(tw);
            snapObjectToTerrain(tw);
            tumbleweeds.push(tw);
            return tw;
        }

        function createModelOutline(mesh) {
            // Criar outline que segue o contorno real do modelo
            if (!mesh.geometry || mesh.isInstancedMesh) return null;

            const edges = new THREE.EdgesGeometry(mesh.geometry, 10); // 10 graus de threshold
            const material = new THREE.LineBasicMaterial({

                linewidth: 4,
                transparent: true,

            const outline = new THREE.LineSegments(edges, material);
            outline.userData.isBillboard = true;

        function applyShadowSettings(object3D) {
            object3D.traverse(obj => {
                if (obj.isMesh) {
                    // Proteger meshes de olhos/íris: já têm configurações próprias
                    if (obj.userData?.isEyeMesh) return;
                    if (obj.material && obj.material.transparent) {
                        obj.castShadow = false;
                        obj.receiveShadow = true;
                    } else {
                        obj.castShadow = true;
                        obj.receiveShadow = true;
                    }
                    if (obj.material) {
                        if (Array.isArray(obj.material)) {
                            obj.material.forEach(mat => mat.wireframe = wireframeMode);
                        } else {
                            obj.material.wireframe = wireframeMode;
                        }
                    }
                }
            });
        }

        function disableShadows(object3D) {

        function applyTransform(object3D, transform) {
            if (!transform) return;

            if (transform.position) {
                object3D.position.set(
                    Number(transform.position.x ?? object3D.position.x),
                    Number(transform.position.y ?? object3D.position.y),
                    Number(transform.position.z ?? object3D.position.z)

            }

            if (transform.rotation) {
                object3D.rotation.set(
                    Number(transform.rotation.x ?? object3D.rotation.x),
                    Number(transform.rotation.y ?? object3D.rotation.y),
                    Number(transform.rotation.z ?? object3D.rotation.z)
                );
            }

            if (transform.scale) {
                object3D.scale.set(
                    Number(transform.scale.x ?? object3D.scale.x),
                    Number(transform.scale.y ?? object3D.scale.y),
                    Number(transform.scale.z ?? object3D.scale.z)
                );
            }
        }

        function getObjectBounds(object3D) {
            if (!object3D) return null;

            object3D.updateMatrixWorld(true);

            let bbox;
            const isHuman = (object3D.name === 'Human');
            let leftLegVis, rightLegVis, leftArmVis, rightArmVis;
            if (isHuman) {
                leftLegVis = object3D.userData.leftLeg ? object3D.userData.leftLeg.visible : true;
                rightLegVis = object3D.userData.rightLeg ? object3D.userData.rightLeg.visible : true;
                leftArmVis = object3D.userData.leftArm ? object3D.userData.leftArm.visible : true;
                rightArmVis = object3D.userData.rightArm ? object3D.userData.rightArm.visible : true;

                if (object3D.userData.leftLeg) object3D.userData.leftLeg.visible = false;
                if (object3D.userData.rightLeg) object3D.userData.rightLeg.visible = false;
                if (object3D.userData.leftArm) object3D.userData.leftArm.visible = false;
                if (object3D.userData.rightArm) object3D.userData.rightArm.visible = false;
            }

            bbox = new THREE.Box3().setFromObject(object3D);

            if (isHuman) {
                if (object3D.userData.leftLeg) object3D.userData.leftLeg.visible = leftLegVis;
                if (object3D.userData.rightLeg) object3D.userData.rightLeg.visible = rightLegVis;
                if (object3D.userData.leftArm) object3D.userData.leftArm.visible = leftArmVis;
                if (object3D.userData.rightArm) object3D.userData.rightArm.visible = rightArmVis;
            }

            return bbox.isEmpty() ? null : bbox;
        }

        function getObjectBottomY(object3D) {

        function getOriginalTerrainHeight(x, z) {
            const dist = Math.sqrt(x * x + z * z);
            const valleyRadius = 800;
            const maxRadius = 1500;
            const maxElevation = 180;
            let elevation = 0;

            if (dist > valleyRadius) {
                const t = Math.min(1, (dist - valleyRadius) / (maxRadius - valleyRadius));
                const intensity = t * t;
                elevation = (
                    Math.sin(x * 0.02) * Math.cos(z * 0.02) * 40 +
                    Math.sin(x * 0.05) * 20 +
                    Math.cos(z * 0.08) * 10
                ) * intensity;
                elevation += intensity * maxElevation;
            }
            return elevation;
        }

        function updateAllObjectSnapping() {
            if (typeof dinoData !== 'undefined' && dinoData?.model) snapObjectToTerrain(dinoData.model);
            if (typeof dino2Data !== 'undefined' && dino2Data?.model) snapObjectToTerrain(dino2Data.model);
            if (typeof trees !== 'undefined') trees.forEach(snapObjectToTerrain);
            if (typeof grasses !== 'undefined') grasses.forEach(snapObjectToTerrain);
            if (typeof rocks !== 'undefined') rocks.forEach(snapObjectToTerrain);
            if (typeof humans !== 'undefined') humans.forEach(snapObjectToTerrain);
            if (typeof cacts !== 'undefined') cacts.forEach(snapObjectToTerrain);
            if (typeof iceSpikes !== 'undefined') iceSpikes.forEach(snapObjectToTerrain);
        }

        window.updateTerrainHeights = function () {
            if (!terrain) return;
            const geometry = terrain.geometry;
            const posAttr = geometry.attributes.position;
            const count = posAttr.count;

            for (let i = 0; i < count; i++) {
                const x = posAttr.getX(i);
                const z = posAttr.getZ(i);
                let y = getOriginalTerrainHeight(x, z);

                if (typeof ponds !== 'undefined') {
                    for (const pond of ponds) {
                        const dx = x - pond.position.x;
                        const dz = z - pond.position.z;
                        const dist = Math.sqrt(dx * dx + dz * dz);
                        const r = (pond.userData?.pondRadius || 80) * pond.scale.x;
                        if (dist < r) {
                            const maxDepth = (pond.userData?.pondDepth || 18) * pond.scale.y;
                            const factor = 1 - (dist / r);
                            const holeDepth = maxDepth * Math.sin(factor * Math.PI / 2);
                            y -= holeDepth;
                        }
                    }
                }
                posAttr.setY(i, y);
            }

            posAttr.needsUpdate = true;
            geometry.computeVertexNormals();
            geometry.computeBoundingBox();
            geometry.computeBoundingSphere();

            // Re-encaixar todos os objectos no terreno agora deformado
            updateAllObjectSnapping();
        };

        function getTerrainHeightAt(x, z, raycasterInstance = null) {
            if (!terrain) return null;

            const downRay = raycasterInstance ?? new THREE.Raycaster();
            downRay.set(
                new THREE.Vector3(x, 500, z),
                new THREE.Vector3(0, -1, 0)
            );

            const hit = downRay.intersectObject(terrain);
            return hit.length > 0 ? hit[0].point.y : null;
        }

        function getTerrainSurfaceOffset(object3D) {
            if (!object3D) return 0;

            return object3D.userData.terrainSurfaceOffset
                ?? (object3D.name === 'Tumbleweed' ? (object3D.userData.groundOffset ?? 0) : 0);
        }

        function alignObjectBottomToWorldY(object3D, targetBottomY) {
            const currentBottomY = getObjectBottomY(object3D);
            if (currentBottomY === null) return;

            object3D.position.y += targetBottomY - currentBottomY;
            object3D.updateMatrixWorld(true);
        }

        function getPlacementClearance(object3D) {
            const currentBottomY = getObjectBottomY(object3D);
            if (currentBottomY === null) return 0;

            return (object3D.position.y - currentBottomY) + getTerrainSurfaceOffset(object3D);
        }

        function snapObjectToTerrain(object3D) {
            if (!object3D || !terrain) return;

            if (object3D.name === 'Pond') {
                const groundY = getOriginalTerrainHeight(object3D.position.x, object3D.position.z);
                if (groundY === null) return;
                object3D.position.y = groundY + 30 * object3D.scale.y;
                object3D.updateMatrixWorld(true);
                return;
            }

            const groundY = getTerrainHeightAt(object3D.position.x, object3D.position.z);
            if (groundY === null) return;

            alignObjectBottomToWorldY(object3D, groundY + getTerrainSurfaceOffset(object3D));
        }

        function getHumanCameraEyeWorldPosition(human, target) {
            if (!human) return target;

            const cameraAnchor = human.userData?.cameraAnchor;
            if (cameraAnchor?.getWorldPosition) {
                human.updateMatrixWorld(true);
                cameraAnchor.getWorldPosition(target);
                return target;
            }

            const humanBounds = getObjectBounds(human);
            if (!humanBounds) {
                target.copy(human.position);
                return target;
            }

            const height = humanBounds.max.y - humanBounds.min.y;
            target.set(
                human.position.x,
                humanBounds.min.y + height * 0.78,
                human.position.z
            );
            return target;
        }

        function getHumanCameraForwardOffset(human) {
            if (!human) return 1.5;

            human.getWorldScale(humanWorldScale);
            return Math.max(1.2, Math.abs(humanWorldScale.z) * 0.8);
        }

        function getWorldCollisionCircles(object3D, translation = null) {
            if (!object3D) return [];

            const collisionCircles = Array.isArray(object3D.userData?.collisionCircles)
                ? object3D.userData.collisionCircles
                : null;

            if (!collisionCircles || collisionCircles.length === 0) {
                const bbox = getObjectBounds(object3D);
                if (!bbox) return [];

                const halfWidth = (bbox.max.x - bbox.min.x) * 0.5;
                const halfDepth = (bbox.max.z - bbox.min.z) * 0.5;
                const radius = Math.sqrt(Math.max(halfWidth, 0.01) * Math.max(halfDepth, 0.01));
                bbox.getCenter(collisionFallbackCenter);

                // compute optional screen-scale based on camera distance
                let screenScale = 1;
                if (collisionUseScreenScale && typeof camera !== 'undefined' && !humanControlMode) {
                    const pos = new THREE.Vector3();
                    object3D.getWorldPosition(pos);
                    const dist = pos.distanceTo(camera.position) || 1;
                    screenScale = collisionScreenRefDistance / Math.max(dist, 1);
                }

                return [{
                    x: collisionFallbackCenter.x + (translation?.x ?? 0),
                    z: collisionFallbackCenter.z + (translation?.z ?? 0),
                    r: radius * screenScale
                }];
            }

            object3D.updateMatrixWorld(true);
            const worldScale = new THREE.Vector3();
            object3D.getWorldScale(worldScale);
            const radiusScale = (Math.abs(worldScale.x) + Math.abs(worldScale.z)) * 0.5;
            const translatedX = translation?.x ?? 0;
            const translatedZ = translation?.z ?? 0;

            // compute optional screen-scale based on camera distance
            let screenScale = 1;
            if (collisionUseScreenScale && typeof camera !== 'undefined' && !humanControlMode) {
                const pos = new THREE.Vector3();
                object3D.getWorldPosition(pos);
                const dist = pos.distanceTo(camera.position) || 1;
                screenScale = collisionScreenRefDistance / Math.max(dist, 1);
            }

            return collisionCircles.map(circle => {
                const localCenter = new THREE.Vector3(circle.x ?? 0, circle.y ?? 0, circle.z ?? 0);
                const worldCenter = localCenter.clone();
                object3D.localToWorld(worldCenter);

                return {
                    x: worldCenter.x + translatedX,
                    z: worldCenter.z + translatedZ,
                    r: (circle.r ?? 0) * radiusScale * screenScale
                };
            });
        }

        function getMeshesInObject(object, list = []) {
            if (!object) return list;
            // Skip human limbs to prevent them from expanding or triggering false collisions
            if (object.parent && object.parent.name === 'Human') {
                const ud = object.parent.userData;
                if (object === ud.leftLeg || object === ud.rightLeg || object === ud.leftArm || object === ud.rightArm) {
                    return list;
                }
            }
            // Skip IceSubSpike meshes to keep ice spike collision on the main vertical spike
            if (object.name === 'IceSubSpike') {
                return list;
            }
            if (object.isMesh) {
                if (object.visible &&
                    object.name !== 'Water' &&
                    object.name !== 'PondBowl' &&
                    !object.userData?.isWater &&
                    !object.userData?.isTerrain &&
                    object.geometry) {
                    list.push(object);
                }
            }
            if (object.children) {
                object.children.forEach(child => getMeshesInObject(child, list));
            }
            return list;
        }

        function objectsCollide3D(objectA, objectB, translationA = null) {
            const boxA = getObjectBounds(objectA);
            if (!boxA) return false;

            if (translationA) {
                boxA.min.add(translationA);
                boxA.max.add(translationA);
            }

            const meshesB = [];
            getMeshesInObject(objectB, meshesB);

            const meshBox = new THREE.Box3();
            for (const mesh of meshesB) {
                mesh.updateMatrixWorld(true);
                meshBox.setFromObject(mesh);

                // If the character is standing on top of the mesh, ignore collision
                if (boxA.min.y >= meshBox.max.y - 1.0) {
                    continue;
                }

                if (boxA.intersectsBox(meshBox)) {
                    return true;
                }
            }

            return false;
        }

        function toTransformData(object3D) {
            return {
                position: {
                    x: object3D.position.x,
                    y: object3D.position.y,
                    z: object3D.position.z
                },
                rotation: {
                    x: object3D.rotation.x,
                    y: object3D.rotation.y,
                    z: object3D.rotation.z
                },
                scale: {
                    x: object3D.scale.x,
                    y: object3D.scale.y,
                    z: object3D.scale.z
                }
            };
        }

        function removeGroupFromScene(groupArray) {
            for (const obj of groupArray) {
                scene.remove(obj);
            }
            groupArray.length = 0;
        }

        function clearScenarioObjects() {
            saveHistoryState();

            if (dinoData?.model) {
                scene.remove(dinoData.model);
                dinoData = null;
            }
            if (dino2Data?.model) {
                scene.remove(dino2Data.model);
                dino2Data = null;
            }
            removeGroupFromScene(trees);
            removeGroupFromScene(grasses);
            removeGroupFromScene(rocks);
            removeGroupFromScene(humans);
            removeGroupFromScene(cacts);
            removeGroupFromScene(ponds);
            removeGroupFromScene(iceSpikes);
            setBushEffectEnabled(false);
            setTumbleweedEffectEnabled(false);

            if (window.clearPickedObject) window.clearPickedObject();

            // Restaurar a elevação original do terreno
            updateTerrainHeights();

            try {
                if (typeof autoSaveScenario === 'function') autoSaveScenario();
            } catch (e) { }
        }

        function removeObjectFromArray(groupArray, object) {
            const idx = groupArray.indexOf(object);
            if (idx >= 0) {
                groupArray.splice(idx, 1);
                return true;
            }
            return false;
        }

        function removeScenarioObject(object) {
            if (!object || object === terrain) return false;

            saveHistoryState();

            let removed = false;
            if (dinoData?.model === object) {
                scene.remove(dinoData.model);
                dinoData = null;
                removed = true;
            } else if (dino2Data?.model === object) {
                scene.remove(dino2Data.model);
                dino2Data = null;
                removed = true;
            } else if (removeObjectFromArray(trees, object)) { scene.remove(object); removed = true; }
            else if (removeObjectFromArray(grasses, object)) { scene.remove(object); removed = true; }
            else if (removeObjectFromArray(bushes, object)) { scene.remove(object); removed = true; }
            else if (removeObjectFromArray(rocks, object)) { scene.remove(object); removed = true; }
            else if (removeObjectFromArray(tumbleweeds, object)) { scene.remove(object); removed = true; }
            else if (removeObjectFromArray(humans, object)) { scene.remove(object); removed = true; }
            else if (removeObjectFromArray(cacts, object)) { scene.remove(object); removed = true; }
            else if (removeObjectFromArray(iceSpikes, object)) { scene.remove(object); removed = true; }
            else if (removeObjectFromArray(ponds, object)) {
                scene.remove(object);
                removed = true;
                updateTerrainHeights();
            }

            if (removed) {
                if (typeof autoSaveScenario === 'function') autoSaveScenario();
            }
            return removed;
        }

        function updateHistoryButtons() {
            const undoBtn = document.getElementById('undoButton');
            const redoBtn = document.getElementById('redoButton');
            if (undoBtn) {
                const canUndo = undoStack.length > 0;
                undoBtn.disabled = !canUndo;
                undoBtn.style.opacity = canUndo ? '1' : '0.4';
                undoBtn.style.cursor = canUndo ? 'pointer' : 'not-allowed';
            }
            if (redoBtn) {
                const canRedo = redoStack.length > 0;
                redoBtn.disabled = !canRedo;
                redoBtn.style.opacity = canRedo ? '1' : '0.4';
                redoBtn.style.cursor = canRedo ? 'pointer' : 'not-allowed';
            }
        }

        function saveHistoryState() {
            if (isInitializing || isLoadingScenario) return;

            const stateStr = JSON.stringify(serializeScenario());
            // Evitar estados idênticos consecutivos
            if (undoStack.length > 0 && undoStack[undoStack.length - 1] === stateStr) {
                return;
            }

            undoStack.push(stateStr);
            if (undoStack.length > MAX_HISTORY) {
                undoStack.shift();
            }

            // Limpa o redo stack quando uma nova ação é tomada
            redoStack.length = 0;
            updateHistoryButtons();
        }

        window.undo = function () {
            if (isDragging || undoStack.length === 0) return;

            const currentState = JSON.stringify(serializeScenario());
            redoStack.push(currentState);

            const previousStateStr = undoStack.pop();
            const previousState = JSON.parse(previousStateStr);

            isLoadingScenario = true;
            try {
                loadScenario(previousState);
            } catch (e) {
                console.error('Erro ao desfazer:', e);
            } finally {
                isLoadingScenario = false;
            }

            if (typeof autoSaveScenario === 'function') autoSaveScenario();
            updateHistoryButtons();
        };

        window.redo = function () {
            if (isDragging || redoStack.length === 0) return;

            const currentState = JSON.stringify(serializeScenario());
            undoStack.push(currentState);

            const nextStateStr = redoStack.pop();
            const nextState = JSON.parse(nextStateStr);

            isLoadingScenario = true;
            try {
                loadScenario(nextState);
            } catch (e) {
                console.error('Erro ao refazer:', e);
            } finally {
                isLoadingScenario = false;
            }

            if (typeof autoSaveScenario === 'function') autoSaveScenario();
            updateHistoryButtons();
        };

        function serializeScenario() {
            const objects = [];

            if (dinoData?.model) {
                objects.push({ type: 'dino', ...toTransformData(dinoData.model) });
            }
            if (dino2Data?.model) {
                objects.push({ type: 'dino2', ...toTransformData(dino2Data.model) });
            }

            trees.forEach(obj => objects.push({ type: 'tree', ...toTransformData(obj) }));
            grasses.forEach(obj => {
                if (!obj.userData?.isAmbientGrass) {
                    objects.push({ type: 'grass', ...toTransformData(obj) });
                }
            });
            rocks.forEach(obj => objects.push({
                type: 'rock',
                rockSize: obj.userData.rockSize || 'large',
                ...toTransformData(obj)
            }));
            humans.forEach(obj => objects.push({ type: 'human', ...toTransformData(obj) }));
            cacts.forEach(obj => objects.push({ type: 'cact', ...toTransformData(obj) }));
            ponds.forEach(obj => objects.push({ type: 'pond', ...toTransformData(obj) }));
            iceSpikes.forEach(obj => objects.push({ type: 'icespike', ...toTransformData(obj) }));

            return {
                version: SCENE_EXPORT_VERSION,
                terrainColor: `#${terrain.material.color.getHexString()}`,
                terrainTintColor,
                terrainTextureSlots: terrainTextureSlots.map(slot => ({ label: slot.label, url: slot.url })),
                terrainActiveTextureSlotIndex,
                bushEffectEnabled,
                grassEffectEnabled,
                tumbleweedEffectEnabled,
                objects
            };
        }

        function autoSaveScenario() {
            if (isInitializing || isLoadingScenario) return;
            try {
                const data = serializeScenario();
                localStorage.setItem('tabletop_autosave', JSON.stringify(data));
            } catch (e) {
                console.warn('Erro ao auto-guardar o cenário:', e);
            }
        }

        function isValidHexColor(value) {
            return typeof value === 'string' && /^#([0-9A-F]{3}|[0-9A-F]{6})$/i.test(value);
        }

        function loadScenario(data) {
            if (!data || !Array.isArray(data.objects)) {
                throw new Error('JSON inválido: falta o array "objects".');
            }

            isLoadingScenario = true;
            try {
                clearScenarioObjects();
                let hasLegacyBushes = false;
                let hasLegacyTumbleweeds = false;

                if (Array.isArray(data.terrainTextureSlots)) {
                    data.terrainTextureSlots.slice(0, terrainTextureSlots.length).forEach((slot, index) => {
                        if (slot && typeof slot.url === 'string') {
                            terrainTextureSlots[index].url = slot.url;
                        }
                    });
                }

                if (isValidHexColor(data.terrainTintColor)) {
                    applyTerrainTintColor(data.terrainTintColor);
                } else if (isValidHexColor(data.terrainColor)) {
                    applyTerrainTintColor(data.terrainColor);
                } else {
                    applyTerrainTintColor('#ffffff');
                }

                refreshTerrainTextureSlotUI();

                if (typeof data.terrainActiveTextureSlotIndex === 'number') {
                    applyTerrainTextureSlot(THREE.MathUtils.clamp(data.terrainActiveTextureSlotIndex, 0, terrainTextureSlots.length - 1));
                } else if (typeof data.terrainTextureType === 'string') {
                    window.setTerrainTexture(data.terrainTextureType);
                } else {
                    applyTerrainTextureSlot(0);
                }

                for (const entry of data.objects) {
                    if (!entry?.type) continue;

                    switch (entry.type) {
                        case 'dino':
                            window.addDino({ transform: entry, silent: true });
                            break;
                        case 'dino2':
                            window.addDino2({ transform: entry, silent: true });
                            break;
                        case 'tree':
                            window.addTree(entry);
                            break;
                        case 'grass':
                            window.addGrass(entry);
                            break;
                        case 'bush':
                            hasLegacyBushes = true;
                            break;
                        case 'rock':
                            window.addRock(entry.rockSize || 'large', entry);
                            break;
                        case 'tumbleweed':
                            hasLegacyTumbleweeds = true;
                            break;
                        case 'cact':
                            window.addCact(entry);
                            break;
                        case 'icespike':
                            window.addIceSpike(entry);
                            break;
                        case 'pond':
                            window.addPond(entry);
                            break;
                        case 'human':
                            window.addHuman(entry);
                            break;
                        default:
                            console.warn('Tipo de objeto não suportado no JSON:', entry.type);
                    }
                }

                if (typeof data.bushEffectEnabled === 'boolean') {
                    setBushEffectEnabled(data.bushEffectEnabled);
                } else {
                    setBushEffectEnabled(hasLegacyBushes);
                }

                if (typeof data.grassEffectEnabled === 'boolean') {
                    setGrassEffectEnabled(data.grassEffectEnabled);
                }

                if (typeof data.tumbleweedEffectEnabled === 'boolean') {
                    setTumbleweedEffectEnabled(data.tumbleweedEffectEnabled);
                } else {
                    setTumbleweedEffectEnabled(hasLegacyTumbleweeds);
                }
            } finally {
                updateTerrainHeights();
                isLoadingScenario = false;
            }

            if (typeof autoSaveScenario === 'function') autoSaveScenario();
        }

            // --- CICLO DIA/NOITE ---

            let dayTimeMinutes = 720;

            // Paleta de cores do céu para horas chave (hora, skyHex, ambientHex)

            const DAY_PALETTE = [
                // Meia-noite
                { t: 0, sky: 0x03061a, amb: 0x1a1a3a, ambI: 0.05, sun: 0x000000, sunI: 0.0 },

                { t: 1440, sky: 0x03061a, amb: 0x1a1a3a, ambI: 0.05, sun: 0x000000, sunI: 0.0 },

            function lerpColor(hexA, hexB, t) {
                const a = new THREE.Color(hexA);
                const b = new THREE.Color(hexB);
                return a.lerp(b, t);
            }

            function getDayPaletteAt(minutes) {
                // Garante que está em [0, 1440]
                const m = ((minutes % 1440) + 1440) % 1440;
                // Encontra os dois keyframes vizinhos
                let i = 0;
                for (let k = 0; k < DAY_PALETTE.length - 1; k++) {
                    if (m >= DAY_PALETTE[k].t && m <= DAY_PALETTE[k + 1].t) {
                        i = k;
                        break;
                    }
                }
                const a = DAY_PALETTE[i];
                const b = DAY_PALETTE[i + 1];
                const span = b.t - a.t;
                const frac = span > 0 ? (m - a.t) / span : 0;
                return {
                    sky: lerpColor(a.sky, b.sky, frac),
                    amb: lerpColor(a.amb, b.amb, frac),
                    ambI: a.ambI + (b.ambI - a.ambI) * frac,
                    sun: lerpColor(a.sun, b.sun, frac),
                    sunI: a.sunI + (b.sunI - a.sunI) * frac,
                };
            }

            function applyDayNightCycle(minutes) {
                const pal = getDayPaletteAt(minutes);

                // Atualiza fundo (céu)
                scene.background.copy(pal.sky);

                // Luz ambiente
                ambientLight.color.copy(pal.amb);
                ambientLight.intensity = pal.ambI;

                // Luz solar (cor e intensidade)
                sunLight.color.copy(pal.sun);
                sunLight.intensity = pal.sunI;

                // Posição angular do sol no céu
                const sunriseMin = 360; // 6h
                const sunsetMin = 1080; // 18h
                const m = ((minutes % 1440) + 1440) % 1440;
                const daySpan = sunsetMin - sunriseMin; // 720 min
                const sunAngle = Math.PI * ((m - sunriseMin) / daySpan); // 0→π durante o dia
                const elevation = Math.sin(sunAngle); // 0→1→0
                const azimuth = Math.cos(sunAngle); // 1→0→-1 (leste→meio→oeste)

                // O offset do sol para a luz direcional
                const orbitRadius = 1200;
                sunLightOffset.set(
                    azimuth * orbitRadius,
                    Math.max(elevation * orbitRadius, 80),
                    -200
                );

                // --- SOL E LUA: posição e visibilidade ---
                const isDay = m > sunriseMin && m < sunsetMin;
                // Transição suave: fade nos 20 min em torno do nascer/pôr do sol
                const fadeDuration = 20;
                let sunAlpha = 0;
                if (isDay) {
                    sunAlpha = Math.min((m - sunriseMin) / fadeDuration, 1, (sunsetMin - m) / fadeDuration);
                }
                const moonAlpha = 1 - sunAlpha;

                // Posição do sol no espaço visual (raio SKY_BODY_ORBIT = 2800 > borda do mapa)
                const sunPos = new THREE.Vector3(
                    azimuth * SKY_BODY_ORBIT,
                    elevation * SKY_BODY_ORBIT,
                    0
                );
                sunMesh.position.copy(sunPos);
                sunMesh.visible = sunAlpha > 0.01;

                // Posição da lua: oposta ao sol (lado noturno do céu)
                const moonAngle = Math.PI + sunAngle;
                const moonElevation = Math.sin(moonAngle);
                const moonAzimuth = Math.cos(moonAngle);
                const moonPos = new THREE.Vector3(
                    moonAzimuth * SKY_BODY_ORBIT,
                    moonElevation * SKY_BODY_ORBIT,
                    0
                );
                moonMesh.position.copy(moonPos);
                moonMesh.visible = moonAlpha > 0.01;

                // Luz direcional da lua: segue a direção orbital da lua
                moonLightOffset.set(
                    moonAzimuth * 1200,
                    Math.max(moonElevation * 1200, 60),
                    200
                );
                moonDirLight.intensity = moonAlpha * 0.45;

                // Atualiza UI
                const h = Math.floor(m / 60);
                const min = Math.floor(m % 60);
                const clockEl = document.getElementById('timeClock');
                if (clockEl) clockEl.textContent = `${String(h).padStart(2, '0')}:${String(min).padStart(2, '0')}`;

                // Ícone: lua quando noite, sol quando dia

                const moonIconEl = document.getElementById('moonIcon');
                if (sunIconEl && moonIconEl) {
                    sunIconEl.style.opacity = isDay ? '1' : '0.3';
                    moonIconEl.style.opacity = isDay ? '0.3' : '1';
                }
            }

            function enterHumanControlMode(targetHuman = null) {
                const human = targetHuman || getHumanForControl();

                camera.getWorldDirection(cameraDirection);

                humanForward.set(Math.sin(humanYaw), 0, Math.cos(humanYaw));

            function updateHumanControl(deltaTime) {
                if (!humanControlMode || !controlledHuman) {
                    return;
                }

                if (deltaTime === undefined || deltaTime === null) {
                    console.warn('deltaTime undefined!');
                    return;
                }

                humanForward.set(Math.sin(humanYaw), 0, Math.cos(humanYaw));
                humanRight.set(humanForward.z, 0, -humanForward.x);

                humanMoveVector.set(0, 0, 0);
                if (humanMoveState.forward) humanMoveVector.add(humanForward);
                if (humanMoveState.backward) humanMoveVector.sub(humanForward);
                if (humanMoveState.left) humanMoveVector.add(humanRight);
                if (humanMoveState.right) humanMoveVector.sub(humanRight);


                // Colisão com objetos (exceto grass, bush e tumbleweed)
                if (humanMoveVector.lengthSq() > 0) {
                    humanMoveVector.normalize().multiplyScalar(humanControlSettings.speed * deltaTime);
                    let collision = false;
                    // Checar colisão com árvores, pedras, cactos, humanos, dino, charcos
                    const checkGroups = [trees, rocks, cacts, humans, ponds, iceSpikes];
                    if (dinoData?.model) checkGroups.push([dinoData.model]);
                    if (dino2Data?.model) checkGroups.push([dino2Data.model]);
                    for (const group of checkGroups) {
                        for (const obj of group) {
                            if (obj === controlledHuman) continue;
                            if (!obj || obj.name === 'Grass' || obj.name === 'Bush' || obj.name === 'Tumbleweed') continue;

                            if (objectsCollide3D(controlledHuman, obj, humanMoveVector)) {
                                collision = true;
                                break;
                            }
                        }
                        if (collision) break;
                    }
                    if (!collision) {
                        controlledHuman.position.add(humanMoveVector);
                        controlledHuman.rotation.y = Math.atan2(humanForward.x, humanForward.z);
                    }
                }

                const previousY = controlledHuman.position.y;
                humanVerticalVelocity -= humanControlSettings.gravity * deltaTime;
                controlledHuman.position.y += humanVerticalVelocity * deltaTime;

                humanGroundRay.set(
                    new THREE.Vector3(controlledHuman.position.x, 500, controlledHuman.position.z),
                    new THREE.Vector3(0, -1, 0)
                );

                // Build dynamic list of all collidable surfaces: terrain + trees + rocks + cacts + humans + ponds + dinos
                const collidables = [terrain];
                trees.forEach(o => collidables.push(o));
                rocks.forEach(o => collidables.push(o));
                cacts.forEach(o => collidables.push(o));
                humans.forEach(o => { if (o !== controlledHuman) collidables.push(o); });
                ponds.forEach(o => collidables.push(o));
                iceSpikes.forEach(o => collidables.push(o));
                if (dinoData?.model) collidables.push(dinoData.model);
                if (dino2Data?.model) collidables.push(dino2Data.model);

                let groundY = -9999;
                const groundHits = humanGroundRay.intersectObjects(collidables, true);
                for (const hit of groundHits) {
                    if (hit.object.name === 'Water' || hit.object.name === 'PondBowl') continue;

                    const isTerrain = (hit.object === terrain);
                    const clearance = getPlacementClearance(controlledHuman);
                    const surfaceY = hit.point.y + clearance;

                    // Always allow terrain, and allow steps/objects if they are not too high above our feet
                    const stepHeight = 8.0;
                    if (isTerrain || surfaceY <= previousY + stepHeight) {
                        if (surfaceY > groundY) {
                            groundY = surfaceY;
                        }
                    }
                }

                if (groundY > -9999) {
                    if (controlledHuman.position.y <= groundY) {
                        controlledHuman.position.y = groundY;
                        humanVerticalVelocity = 0;
                        humanCanJump = true;
                    } else {
                        humanCanJump = false;
                    }
                }

                getHumanCameraEyeWorldPosition(controlledHuman, humanEyePosition);
                const faceOffset = getHumanCameraForwardOffset(controlledHuman) + 1.0;
                camera.position.copy(humanEyePosition).addScaledVector(humanForward, faceOffset);

                humanLookDirection.set(
                    Math.sin(humanYaw) * Math.cos(humanPitch),
                    Math.sin(humanPitch),
                    Math.cos(humanYaw) * Math.cos(humanPitch)
                );
                humanLookTarget.copy(camera.position).add(humanLookDirection);
                camera.lookAt(humanLookTarget);
            }
